<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Блэкджек</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    @font-face {
      font-family: 'PixelFont';
      src: url('pixel-font.ttf') format('truetype');
      font-display: swap;
    }
    :root {
      --bg: #0a0a0a;
      --panel: #1a1a1a;
      --panel-light: #2a2a2a;
      --text: #ffffff;
      --text-dim: #888888;
      --border: #e0e0e0;
      --border-dim: #444444;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'PixelFont', 'Courier New', monospace;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }
    .header {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      padding: 16px 16px 0 16px;
    }
    .back-btn {
      background: var(--panel-light);
      color: var(--text);
      border: 3px solid var(--border);
      padding: 10px 16px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 3px 3px 0 var(--border-dim);
    }
    .back-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border-dim);
    }
    h1 {
      margin: 16px 0;
      font-weight: 400;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 var(--border-dim);
      text-align: center;
    }
    .game-container {
      width: 100%;
      max-width: 500px;
      padding: 16px;
    }
    .table {
      background: var(--panel);
      padding: 20px;
      margin-bottom: 16px;
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .section-label {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .cards {
      display: flex;
      gap: 8px;
      min-height: 80px;
      align-items: center;
      flex-wrap: wrap;
    }
    .card {
      width: 50px;
      height: 75px;
      background: var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      font-weight: 400;
      color: var(--bg);
      border: 2px solid var(--bg);
    }
    .card.red {
      color: var(--text-dim);
    }
    .card.hidden {
      background: var(--panel-light);
      color: var(--panel-light);
      border-color: var(--border-dim);
    }
    .score {
      font-size: 14px;
      color: var(--text);
      margin-top: 8px;
      text-transform: uppercase;
    }
    .controls-box {
      background: var(--panel);
      padding: 20px;
      border: 3px solid var(--border);
      text-align: center;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .balance-box {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      margin-bottom: 12px;
      font-size: 14px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--border-dim);
    }
    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 3px solid var(--border);
      background: var(--bg);
      color: var(--text);
      text-align: center;
      font-size: 16px;
      font-family: inherit;
      margin-bottom: 16px;
      outline: none;
    }
    input[type="number"]:focus {
      border-color: var(--text);
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 14px 4px;
      border: 3px solid var(--border);
      font-size: 12px;
      cursor: pointer;
      font-weight: 400;
      color: var(--text);
      background: var(--panel-light);
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 3px 3px 0 var(--border-dim);
    }
    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border-dim);
    }
    .btn:disabled {
      opacity: 0.5;
      box-shadow: 1px 1px 0 var(--border-dim);
      transform: translate(2px, 2px);
    }
    .btn-deal {
      background: var(--border);
      color: var(--bg);
    }
    .btn-hit {
      background: var(--panel-light);
    }
    .btn-stand {
      background: var(--bg);
    }
    .status-text {
      text-align: center;
      font-size: 14px;
      margin-bottom: 16px;
      min-height: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text);
    }
    .history-box {
      background: var(--panel);
      padding: 16px;
      font-size: 11px;
      max-height: 120px;
      overflow-y: auto;
      color: var(--text-dim);
      margin-top: 16px;
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border-dim);
      text-transform: uppercase;
    }
    .history-box::-webkit-scrollbar {
      width: 8px;
    }
    .history-box::-webkit-scrollbar-track {
      background: var(--bg);
    }
    .history-box::-webkit-scrollbar-thumb {
      background: var(--border-dim);
    }
    .divider {
      margin: 16px 0;
      border-top: 2px dashed var(--border-dim);
    }
  </style>
</head>
<body>
  <audio id="bg-music" loop style="display:none;"></audio>
  <script>
  (function(){
    var u=localStorage.getItem('currentUser');
    if(!u)return;
    var d=localStorage.getItem('set_music_'+u);
    var v=parseInt(localStorage.getItem('set_volume_'+u))||50;
    var on=localStorage.getItem('set_music_on_'+u)!=='false';
    var a=document.getElementById('bg-music');
    var started=false;
    function startMusic(){
      if(started)return;
      if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
      started=true;
    }
    document.addEventListener('click',startMusic,{once:true});
    document.addEventListener('touchstart',startMusic,{once:true});
    if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
  })();
  </script>
  <div class="header"><a href="index.html" class="back-btn" onclick="localStorage.setItem('coming_back','true')">&lt;&lt; НАЗАД</a></div>
  <div class="game-container">
    <h1>БЛЭКДЖЕК 21</h1>
    <div class="status-text" id="status-text">СДЕЛАЙТЕ СТАВКУ И НАЖМИТЕ РАЗДАТЬ</div>
    <div class="table">
      <div class="section-label">ДИЛЕР</div>
      <div class="cards" id="dealer-cards"></div>
      <div class="score" id="dealer-score"></div>
      <div class="divider"></div>
      <div class="section-label">ИГРОК</div>
      <div class="cards" id="player-cards"></div>
      <div class="score" id="player-score"></div>
    </div>
    <div class="controls-box">
      <div class="balance-box"><span>БАЛАНС</span><span id="balance-display">1000 РУБ</span></div>
      <input type="number" id="bet-input" min="1" value="100" placeholder="СТАВКА" />
      <div class="btn-row">
        <button class="btn btn-deal" id="btn-deal">РАЗДАТЬ</button>
        <button class="btn btn-hit" id="btn-hit" disabled>ВЗЯТЬ</button>
        <button class="btn btn-stand" id="btn-stand" disabled>ХВАТИТ</button>
      </div>
    </div>
    <div class="history-box" id="history-box">ИСТОРИЯ ИГР</div>
  </div>
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyBKfDdHsbTzZjfc4hHX3SJV563UbVBvqPQ",
      authDomain: "lucky-finger-b8b05.firebaseapp.com",
      databaseURL: "https://lucky-finger-b8b05-default-rtdb.firebaseio.com",
      projectId: "lucky-finger-b8b05",
      storageBucket: "lucky-finger-b8b05.firebasestorage.app",
      messagingSenderId: "843623003093",
      appId: "1:843623003093:web:05acfb8aa828e6cc2e835c"
    };
    firebase.initializeApp(firebaseConfig);
    var database = firebase.database();
    var accountsCache = {};
    var currentUser = localStorage.getItem('currentUser');
    if (!currentUser) window.location.href = 'index.html';
    var balance = parseInt(localStorage.getItem('bal_' + currentUser)) || 1000;
    var deck = [], playerHand = [], dealerHand = [], gameActive = false, bet = 0;
    var suits = ['♠','♥','♦','♣'];

    async function loadAcc() { try { var snapshot = await database.ref('accounts').get(); accountsCache = snapshot.val() || {}; } catch(e) {} }
    async function saveAcc() { try { await database.ref('accounts').set(accountsCache); } catch(e) {} }
    function saveBal() { localStorage.setItem('bal_' + currentUser, balance); document.getElementById('balance-display').textContent = balance.toLocaleString() + ' РУБ'; syncNow(); }
    async function syncNow() { if (accountsCache[currentUser]) { accountsCache[currentUser].balance = balance; await saveAcc(); } }
    function addHistory(text) { var box = document.getElementById('history-box'); if(!box) return; var div = document.createElement('div'); div.textContent = text; div.style.padding = '4px 0'; div.style.borderBottom = '2px solid var(--border-dim)'; box.insertBefore(div, box.firstChild); while(box.children.length > 20) { box.removeChild(box.lastChild); } }
    document.getElementById('balance-display').textContent = balance.toLocaleString() + ' РУБ';

    function shuffle() { deck = []; for(var s = 0; s < suits.length; s++) for(var v = 2; v <= 14; v++) deck.push({v: v, s: suits[s]}); for(var i = deck.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp; } }
    function cardValue(v) { if(v === 14) return 11; if(v >= 10) return 10; return v; }
    function handScore(hand) { var s = 0, aces = 0; for(var i = 0; i < hand.length; i++) { s += cardValue(hand[i].v); if(hand[i].v === 14) aces++; } while(s > 21 && aces > 0) { s -= 10; aces--; } return s; }
    function renderCard(c, hidden) { return '<div class="card ' + (hidden ? 'hidden' : '') + ' ' + (c.s === '♥' || c.s === '♦' ? 'red' : '') + '">' + (hidden ? '?' : (c.v === 14 ? 'A' : c.v === 13 ? 'K' : c.v === 12 ? 'Q' : c.v === 11 ? 'J' : c.v) + c.s) + '</div>'; }
    function render() {
      document.getElementById('player-cards').innerHTML = playerHand.map(function(c) { return renderCard(c, false); }).join('');
      document.getElementById('player-score').textContent = 'СЧЁТ: ' + handScore(playerHand);
      document.getElementById('dealer-cards').innerHTML = dealerHand.map(function(c, i) { return renderCard(c, i === 0 && gameActive); }).join('');
      document.getElementById('dealer-score').textContent = gameActive ? 'СЧЁТ: ?' : 'СЧЁТ: ' + handScore(dealerHand);
    }

    document.getElementById('btn-deal').onclick = function() {
      if(gameActive) return;
      bet = +document.getElementById('bet-input').value;
      if(!bet || bet <= 0 || bet > balance) { alert('НЕКОРРЕКТНАЯ СТАВКА'); return; }
      balance -= bet; saveBal();
      shuffle(); playerHand = [deck.pop(), deck.pop()]; dealerHand = [deck.pop(), deck.pop()];
      gameActive = true;
      document.getElementById('btn-deal').disabled = true;
      document.getElementById('btn-hit').disabled = false;
      document.getElementById('btn-stand').disabled = false;
      document.getElementById('status-text').textContent = 'ИГРА ИДЁТ...';
      document.getElementById('status-text').style.color = 'var(--text)';
      if(handScore(playerHand) === 21) { stand(); return; }
      render();
    };

    document.getElementById('btn-hit').onclick = function() {
      if(!gameActive) return;
      playerHand.push(deck.pop()); render();
      if(handScore(playerHand) > 21) { endGame(false); }
    };

    document.getElementById('btn-stand').onclick = function() { if(gameActive) stand(); };

    function stand() {
      gameActive = false;
      while(handScore(dealerHand) < 17) dealerHand.push(deck.pop());
      var ps = handScore(playerHand), ds = handScore(dealerHand);
      var won = false, win = 0;
      if(ps > 21) { won = false; }
      else if(ds > 21) { won = true; win = bet * 2; }
      else if(ps > ds) { won = true; win = bet * 2; }
      else if(ps === ds) { won = true; win = bet; }
      else { won = false; }
      if(ps === 21 && playerHand.length === 2) { won = true; win = Math.floor(bet * 2.5); }
      balance += win; saveBal();
      document.getElementById('status-text').textContent = won ? 'ПОБЕДА! +' + win + ' РУБ' : 'ПОРАЖЕНИЕ. -' + bet + ' РУБ';
      document.getElementById('status-text').style.color = won ? 'var(--text)' : 'var(--text-dim)';
      addHistory(won ? 'БЛЭКДЖЕК: +' + win + ' РУБ' : 'БЛЭКДЖЕК: -' + bet + ' РУБ');
      document.getElementById('btn-deal').disabled = false;
      document.getElementById('btn-hit').disabled = true;
      document.getElementById('btn-stand').disabled = true;
      render();
    }

    function endGame(bust) { gameActive = false; stand(); }

    (async function() { await loadAcc(); })();
  </script>
</body>
      </html>
