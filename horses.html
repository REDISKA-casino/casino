<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Скачки</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    @font-face {
      font-family: 'PixelFont';
      src: url('pixel-font.ttf') format('truetype');
      font-display: swap;
    }
    :root {
      --bg: #0a0a0a;
      --panel: #1a1a1a;
      --panel-light: #2a2a2a;
      --text: #ffffff;
      --text-dim: #888888;
      --border: #e0e0e0;
      --border-dim: #444444;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'PixelFont', 'Courier New', monospace;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }
    .header {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      padding: 16px 16px 0 16px;
    }
    .back-btn {
      background: var(--panel-light);
      color: var(--text);
      border: 3px solid var(--border);
      padding: 10px 16px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 3px 3px 0 var(--border-dim);
    }
    .back-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border-dim);
    }
    h1 {
      margin: 16px 0;
      font-weight: 400;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 var(--border-dim);
      text-align: center;
    }
    .game-container {
      width: 100%;
      max-width: 500px;
      padding: 16px;
    }
    .track {
      background: var(--bg);
      padding: 12px;
      margin-bottom: 16px;
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .lane {
      display: flex;
      align-items: center;
      height: 44px;
      margin: 8px 0;
      background: var(--panel);
      border: 2px solid var(--border-dim);
      position: relative;
      overflow: hidden;
    }
    .horse {
      font-size: 12px;
      font-weight: 400;
      position: absolute;
      left: 0;
      color: var(--text);
      letter-spacing: 1px;
    }
    .finish {
      position: absolute;
      right: 10px;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 400;
    }
    .controls-box {
      background: var(--panel);
      padding: 20px;
      border: 3px solid var(--border);
      text-align: center;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .balance-box {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      margin-bottom: 12px;
      font-size: 14px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--border-dim);
    }
    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 3px solid var(--border);
      background: var(--bg);
      color: var(--text);
      text-align: center;
      font-size: 16px;
      font-family: inherit;
      margin-bottom: 16px;
      outline: none;
    }
    input[type="number"]:focus {
      border-color: var(--text);
    }
    .horse-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .horse-btn {
      padding: 12px 4px;
      border: 3px solid var(--border);
      font-size: 10px;
      font-weight: 400;
      cursor: pointer;
      color: var(--text);
      background: var(--panel-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 3px 3px 0 var(--border-dim);
    }
    .horse-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border-dim);
    }
    .horse-btn.selected {
      background: var(--border);
      color: var(--bg);
      box-shadow: 2px 2px 0 var(--border-dim);
      transform: translate(2px, 2px);
    }
    .horse-btn:disabled {
      opacity: 0.5;
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border-dim);
    }
    .btn-race {
      width: 100%;
      padding: 14px;
      border: 3px solid var(--border);
      font-size: 14px;
      cursor: pointer;
      font-weight: 400;
      color: var(--bg);
      background: var(--border);
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .btn-race:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .btn-race:disabled {
      opacity: 0.5;
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .status-text {
      text-align: center;
      font-size: 14px;
      margin-bottom: 16px;
      min-height: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text);
    }
    .history-box {
      background: var(--panel);
      padding: 16px;
      font-size: 11px;
      max-height: 120px;
      overflow-y: auto;
      color: var(--text-dim);
      margin-top: 16px;
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border-dim);
      text-transform: uppercase;
    }
    .history-box::-webkit-scrollbar {
      width: 8px;
    }
    .history-box::-webkit-scrollbar-track {
      background: var(--bg);
    }
    .history-box::-webkit-scrollbar-thumb {
      background: var(--border-dim);
    }
  </style>
</head>
<body>
  <audio id="bg-music" loop style="display:none;"></audio>
  <script>
  (function(){
    var u=localStorage.getItem('currentUser');
    if(!u)return;
    var d=localStorage.getItem('set_music_'+u);
    var v=parseInt(localStorage.getItem('set_volume_'+u))||50;
    var on=localStorage.getItem('set_music_on_'+u)!=='false';
    var a=document.getElementById('bg-music');
    var started=false;
    function startMusic(){
      if(started)return;
      if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
      started=true;
    }
    document.addEventListener('click',startMusic,{once:true});
    document.addEventListener('touchstart',startMusic,{once:true});
    if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
  })();
  </script>
  <div class="header"><a href="index.html" class="back-btn" onclick="localStorage.setItem('coming_back','true')">&lt;&lt; НАЗАД</a></div>
  <div class="game-container">
    <h1>СКАЧКИ</h1>
    <div class="status-text" id="status-text">ВЫБЕРИТЕ ЛОШАДЬ</div>
    <div class="track">
      <div class="lane"><span class="horse" id="horse1">[H1]</span><span class="finish">[F]</span></div>
      <div class="lane"><span class="horse" id="horse2">[H2]</span><span class="finish">[F]</span></div>
      <div class="lane"><span class="horse" id="horse3">[H3]</span><span class="finish">[F]</span></div>
      <div class="lane"><span class="horse" id="horse4">[H4]</span><span class="finish">[F]</span></div>
    </div>
    <div class="controls-box">
      <div class="balance-box"><span>БАЛАНС</span><span id="balance-display">1000 РУБ</span></div>
      <input type="number" id="bet-input" min="1" value="100" placeholder="СТАВКА" />
      <div class="horse-buttons">
        <button class="horse-btn" data-horse="1">ЛОШАДЬ 1<br>X3</button>
        <button class="horse-btn" data-horse="2">ЛОШАДЬ 2<br>X2.5</button>
        <button class="horse-btn" data-horse="3">ЕДИНОРОГ<br>X5</button>
        <button class="horse-btn" data-horse="4">ЛОШАДЬ 4<br>X2</button>
      </div>
      <button class="btn-race" id="btn-race">НА СТАРТ!</button>
    </div>
    <div class="history-box" id="history-box">ИСТОРИЯ ЗАБЕГОВ</div>
  </div>
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyBKfDdHsbTzZjfc4hHX3SJV563UbVBvqPQ",
      authDomain: "lucky-finger-b8b05.firebaseapp.com",
      databaseURL: "https://lucky-finger-b8b05-default-rtdb.firebaseio.com",
      projectId: "lucky-finger-b8b05",
      storageBucket: "lucky-finger-b8b05.firebasestorage.app",
      messagingSenderId: "843623003093",
      appId: "1:843623003093:web:05acfb8aa828e6cc2e835c"
    };
    firebase.initializeApp(firebaseConfig);
    var database = firebase.database();
    var accountsCache = {};
    var currentUser = localStorage.getItem('currentUser');
    if (!currentUser) window.location.href = 'index.html';
    var balance = parseInt(localStorage.getItem('bal_' + currentUser)) || 1000;
    var selectedHorse = null, isRacing = false;
    var multipliers = {1:3, 2:2.5, 3:5, 4:2};

    async function loadAcc() { try { var snapshot = await database.ref('accounts').get(); accountsCache = snapshot.val() || {}; } catch(e) {} }
    async function saveAcc() { try { await database.ref('accounts').set(accountsCache); } catch(e) {} }
    function saveBal() { localStorage.setItem('bal_' + currentUser, balance); document.getElementById('balance-display').textContent = balance.toLocaleString() + ' РУБ'; syncNow(); }
    async function syncNow() { if (accountsCache[currentUser]) { accountsCache[currentUser].balance = balance; await saveAcc(); } }
    function addHistory(text) { var box = document.getElementById('history-box'); if(!box) return; var div = document.createElement('div'); div.textContent = text; div.style.padding = '6px 0'; div.style.borderBottom = '2px solid var(--border-dim)'; box.insertBefore(div, box.firstChild); while(box.children.length > 20) { box.removeChild(box.lastChild); } }
    document.getElementById('balance-display').textContent = balance.toLocaleString() + ' РУБ';

    document.querySelectorAll('.horse-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        if(isRacing) return;
        document.querySelectorAll('.horse-btn').forEach(function(b) { b.classList.remove('selected'); });
        this.classList.add('selected');
        selectedHorse = +this.dataset.horse;
      });
    });

    document.getElementById('btn-race').onclick = function() {
      if(isRacing || !selectedHorse) return;
      var bet = +document.getElementById('bet-input').value;
      if(!bet || bet <= 0 || bet > balance) { alert('НЕКОРРЕКТНАЯ СТАВКА'); return; }
      isRacing = true; document.getElementById('btn-race').disabled = true;
      document.querySelectorAll('.horse-btn').forEach(function(b) { b.disabled = true; });
      balance -= bet; saveBal();
      for(var i = 1; i <= 4; i++) document.getElementById('horse' + i).style.left = '0px';
      var winner = Math.floor(Math.random() * 4) + 1;
      var finishTime = 3000 + Math.random() * 2000;
      var startTime = Date.now();
      var trackWidth = document.querySelector('.lane').clientWidth - 50;
      
      function animateRace() {
        var elapsed = Date.now() - startTime;
        var progress = Math.min(elapsed / finishTime, 1);
        for(var i = 1; i <= 4; i++) {
          var pos;
          if(i === winner) {
            pos = progress * trackWidth;
          } else {
            pos = (progress - Math.random() * 0.1) * trackWidth;
            if(pos < 0) pos = 0;
            if(pos > trackWidth) pos = trackWidth - 10;
          }
          document.getElementById('horse' + i).style.left = pos + 'px';
        }
        if(progress >= 1) {
          var won = winner === selectedHorse;
          var win = won ? Math.floor(bet * multipliers[selectedHorse]) : 0;
          balance += win; saveBal();
          document.getElementById('status-text').textContent = won ? 'ЛОШАДЬ ' + winner + ' ПОБЕДИЛА! +' + win + ' РУБ' : 'ЛОШАДЬ ' + winner + ' ПОБЕДИЛА. -' + bet + ' РУБ';
          document.getElementById('status-text').style.color = won ? 'var(--text)' : 'var(--text-dim)';
          addHistory('ЛОШАДЬ ' + winner + ': ' + (won ? '+' + win + ' РУБ' : '-' + bet + ' РУБ'));
          isRacing = false; document.getElementById('btn-race').disabled = false;
          document.querySelectorAll('.horse-btn').forEach(function(b) { b.disabled = false; });
        } else {
          requestAnimationFrame(animateRace);
        }
      }
      requestAnimationFrame(animateRace);
    };

    (async function() { await loadAcc(); })();
  </script>
</body>
  </html>
