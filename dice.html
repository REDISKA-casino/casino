<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Кости</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    @font-face {
      font-family: 'PixelFont';
      src: url('pixel-font.ttf') format('truetype');
      font-display: swap;
    }
    :root {
      --bg: #0a0a0a;
      --panel: #1a1a1a;
      --panel-light: #2a2a2a;
      --text: #ffffff;
      --text-dim: #888888;
      --border: #e0e0e0;
      --border-dim: #444444;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'PixelFont', 'Courier New', monospace;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }
    .header {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      padding: 16px 16px 0 16px;
    }
    .back-btn {
      background: var(--panel-light);
      color: var(--text);
      border: 3px solid var(--border);
      padding: 10px 16px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 3px 3px 0 var(--border-dim);
    }
    .back-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border-dim);
    }
    h1 {
      margin: 16px 0;
      font-weight: 400;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 var(--border-dim);
      text-align: center;
    }
    .game-container {
      width: 100%;
      max-width: 500px;
      padding: 16px;
    }
    .dice-area {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 24px 0;
    }
    .dice {
      width: 90px;
      height: 90px;
      background: var(--bg);
      border: 3px solid var(--border);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
      font-weight: 400;
      color: var(--text);
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .dice.rolling {
      animation: shake 0.3s infinite;
    }
    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 2px); }
      75% { transform: translate(2px, -2px); }
    }
    .controls-box {
      background: var(--panel);
      padding: 20px;
      border: 3px solid var(--border);
      text-align: center;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .balance-box {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      margin-bottom: 12px;
      font-size: 14px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--border-dim);
    }
    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 3px solid var(--border);
      background: var(--bg);
      color: var(--text);
      text-align: center;
      font-size: 16px;
      font-family: inherit;
      margin-bottom: 16px;
      outline: none;
    }
    input[type="number"]:focus {
      border-color: var(--text);
    }
    .bet-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .bet-row {
      display: grid;
      gap: 8px;
    }
    .bet-row.top {
      grid-template-columns: 1fr 1fr 1fr;
    }
    .bet-row.bottom {
      grid-template-columns: 1fr 1fr;
    }
    .bet-btn {
      padding: 12px 4px;
      border: 3px solid var(--border);
      font-size: 10px;
      font-weight: 400;
      cursor: pointer;
      color: var(--text);
      background: var(--panel-light);
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 3px 3px 0 var(--border-dim);
    }
    .bet-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border-dim);
    }
    .bet-btn.selected {
      background: var(--border);
      color: var(--bg);
      box-shadow: 2px 2px 0 var(--border-dim);
      transform: translate(2px, 2px);
    }
    .btn-roll {
      width: 100%;
      padding: 14px;
      border: 3px solid var(--border);
      font-size: 14px;
      cursor: pointer;
      font-weight: 400;
      color: var(--bg);
      background: var(--border);
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .btn-roll:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .btn-roll:disabled {
      opacity: 0.5;
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .status-text {
      text-align: center;
      font-size: 14px;
      margin-bottom: 16px;
      min-height: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text);
    }
    .payout-info {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 16px;
      text-transform: uppercase;
      line-height: 1.5;
    }
    .history-box {
      background: var(--panel);
      padding: 16px;
      font-size: 11px;
      max-height: 120px;
      overflow-y: auto;
      color: var(--text-dim);
      margin-top: 16px;
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border-dim);
      text-transform: uppercase;
    }
    .history-box::-webkit-scrollbar {
      width: 8px;
    }
    .history-box::-webkit-scrollbar-track {
      background: var(--bg);
    }
    .history-box::-webkit-scrollbar-thumb {
      background: var(--border-dim);
    }
  </style>
</head>
<body>
  <audio id="bg-music" loop style="display:none;"></audio>
  <script>
  (function(){
    var u=localStorage.getItem('currentUser');
    if(!u)return;
    var d=localStorage.getItem('set_music_'+u);
    var v=parseInt(localStorage.getItem('set_volume_'+u))||50;
    var on=localStorage.getItem('set_music_on_'+u)!=='false';
    var a=document.getElementById('bg-music');
    var started=false;
    function startMusic(){
      if(started)return;
      if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
      started=true;
    }
    document.addEventListener('click',startMusic,{once:true});
    document.addEventListener('touchstart',startMusic,{once:true});
    if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
  })();
  </script>
  <div class="header"><a href="index.html" class="back-btn" onclick="localStorage.setItem('coming_back','true')">&lt;&lt; НАЗАД</a></div>
  <div class="game-container">
    <h1>КОСТИ</h1>
    <div class="status-text" id="status-text">ВЫБЕРИТЕ СТАВКУ</div>
    <div class="dice-area">
      <div class="dice" id="dice1">1</div>
      <div class="dice" id="dice2">1</div>
    </div>
    <div class="controls-box">
      <div class="balance-box"><span>БАЛАНС</span><span id="balance-display">1000 РУБ</span></div>
      <input type="number" id="bet-input" min="1" value="100" placeholder="СТАВКА" />
      <div class="bet-buttons">
        <div class="bet-row top">
          <button class="bet-btn" data-bet="7">СУММА 7<br>X4</button>
          <button class="bet-btn" data-bet="11">СУММА 11<br>X5</button>
          <button class="bet-btn" data-bet="2-12">2 ИЛИ 12<br>X10</button>
        </div>
        <div class="bet-row bottom">
          <button class="bet-btn" data-bet="even">ЧЁТ<br>X1.5</button>
          <button class="bet-btn" data-bet="odd">НЕЧЕТ<br>X1.5</button>
        </div>
      </div>
      <button class="btn-roll" id="btn-roll">БРОСИТЬ КОСТИ</button>
      <div class="payout-info">ВЫПЛАТЫ: СУММА 7=X4 | 11=X5 | 2/12=X10 | ЧЁТ/НЕЧЕТ=X1.5</div>
    </div>
    <div class="history-box" id="history-box">ИСТОРИЯ БРОСКОВ</div>
  </div>
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyBKfDdHsbTzZjfc4hHX3SJV563UbVBvqPQ",
      authDomain: "lucky-finger-b8b05.firebaseapp.com",
      databaseURL: "https://lucky-finger-b8b05-default-rtdb.firebaseio.com",
      projectId: "lucky-finger-b8b05",
      storageBucket: "lucky-finger-b8b05.firebasestorage.app",
      messagingSenderId: "843623003093",
      appId: "1:843623003093:web:05acfb8aa828e6cc2e835c"
    };
    firebase.initializeApp(firebaseConfig);
    var database = firebase.database();
    var accountsCache = {};
    var currentUser = localStorage.getItem('currentUser');
    if (!currentUser) window.location.href = 'index.html';
    var balance = parseInt(localStorage.getItem('bal_' + currentUser)) || 1000;
    var selectedBet = null, isRolling = false;
    var diceFaces = ['1','2','3','4','5','6'];

    async function loadAcc() { try { var snapshot = await database.ref('accounts').get(); accountsCache = snapshot.val() || {}; } catch(e) {} }
    async function saveAcc() { try { await database.ref('accounts').set(accountsCache); } catch(e) {} }
    function saveBal() { localStorage.setItem('bal_' + currentUser, balance); document.getElementById('balance-display').textContent = balance.toLocaleString() + ' РУБ'; syncNow(); }
    async function syncNow() { if (accountsCache[currentUser]) { accountsCache[currentUser].balance = balance; await saveAcc(); } }
    function addHistory(text) { var box = document.getElementById('history-box'); if(!box) return; var div = document.createElement('div'); div.textContent = text; div.style.padding = '6px 0'; div.style.borderBottom = '2px solid var(--border-dim)'; box.insertBefore(div, box.firstChild); while(box.children.length > 20) { box.removeChild(box.lastChild); } }
    document.getElementById('balance-display').textContent = balance.toLocaleString() + ' РУБ';

    document.querySelectorAll('.bet-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.bet-btn').forEach(function(b) { b.classList.remove('selected'); });
        this.classList.add('selected');
        selectedBet = this.dataset.bet;
      });
    });

    document.getElementById('btn-roll').onclick = function() {
      if(isRolling || !selectedBet) return;
      var bet = +document.getElementById('bet-input').value;
      if(!bet || bet <= 0 || bet > balance) { alert('НЕКОРРЕКТНАЯ СТАВКА'); return; }
      isRolling = true; document.getElementById('btn-roll').disabled = true; balance -= bet; saveBal();
      var d1 = document.getElementById('dice1'), d2 = document.getElementById('dice2');
      d1.classList.add('rolling'); d2.classList.add('rolling');
      var c = 0;
      var iv = setInterval(function() {
        d1.textContent = diceFaces[Math.floor(Math.random() * 6)];
        d2.textContent = diceFaces[Math.floor(Math.random() * 6)];
        c++;
        if(c >= 15) {
          clearInterval(iv);
          d1.classList.remove('rolling'); d2.classList.remove('rolling');
          var v1 = Math.floor(Math.random() * 6) + 1, v2 = Math.floor(Math.random() * 6) + 1, sum = v1 + v2;
          d1.textContent = diceFaces[v1 - 1]; d2.textContent = diceFaces[v2 - 1];
          var w = 0, won = false;
          switch(selectedBet) {
            case '7': if(sum === 7) { w = bet * 4; won = true; } break;
            case '11': if(sum === 11) { w = bet * 5; won = true; } break;
            case '2-12': if(sum === 2 || sum === 12) { w = bet * 10; won = true; } break;
            case 'even': if(sum % 2 === 0) { w = Math.floor(bet * 1.5); won = true; } break;
            case 'odd': if(sum % 2 === 1) { w = Math.floor(bet * 1.5); won = true; } break;
          }
          balance += w; saveBal();
          document.getElementById('status-text').textContent = won ? v1 + '+' + v2 + '=' + sum + '! +' + w + ' РУБ' : v1 + '+' + v2 + '=' + sum + '. -' + bet + ' РУБ';
          document.getElementById('status-text').style.color = won ? 'var(--text)' : 'var(--text-dim)';
          addHistory('БРОСОК ' + v1 + '+' + v2 + '=' + sum + ': ' + (won ? '+' + w + ' РУБ' : '-' + bet + ' РУБ'));
          isRolling = false; document.getElementById('btn-roll').disabled = false;
        }
      }, 80);
    };

    (async function() { await loadAcc(); })();
  </script>
</body>
</html>
