<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Слоты 777</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    @font-face {
      font-family: 'PixelFont';
      src: url('pixel-font.ttf') format('truetype');
      font-display: swap;
    }
    :root {
      --bg: #0a0a0a;
      --panel: #1a1a1a;
      --panel-light: #2a2a2a;
      --text: #ffffff;
      --text-dim: #888888;
      --border: #e0e0e0;
      --border-dim: #444444;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'PixelFont', 'Courier New', monospace;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
      text-transform: uppercase;
    }
    .header {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      padding: 16px 16px 0 16px;
    }
    .back-btn {
      background: var(--panel-light);
      color: var(--text);
      border: 3px solid var(--border);
      padding: 10px 16px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 1px;
      box-shadow: 3px 3px 0 var(--border-dim);
    }
    .back-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border-dim);
    }
    h1 {
      margin: 16px 0;
      font-weight: 400;
      font-size: 20px;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 var(--border-dim);
      text-align: center;
    }
    .game-container {
      width: 100%;
      max-width: 500px;
      padding: 16px;
    }
    .slots-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 3/2;
      background: var(--bg);
      border: 3px solid var(--border);
      overflow: hidden;
      box-shadow: 4px 4px 0 var(--border-dim);
      margin-bottom: 16px;
    }
    .bonus-effect {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      display: none;
    }
    .bonus-effect.active {
      display: block;
      animation: bonusFlash 0.8s ease-out;
    }
    @keyframes bonusFlash {
      0% { background: var(--text); }
      50% { background: var(--panel-light); }
      100% { background: transparent; }
    }
    .bonus-particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 6;
    }
    .particle {
      position: absolute;
      font-size: 24px;
      color: var(--text);
      animation: fall linear forwards;
      pointer-events: none;
    }
    @keyframes fall {
      0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
    .reel-container {
      display: flex;
      height: 100%;
      background: var(--bg);
      position: relative;
    }
    .reel-separator {
      width: 3px;
      background: var(--border-dim);
      z-index: 10;
    }
    .reel {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }
    .reel-content {
      display: flex;
      flex-direction: column;
    }
    .symbol {
      height: calc(100vw / 3 * 2 / 3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      color: var(--text-dim);
      user-select: none;
      flex-shrink: 0;
      font-weight: 400;
    }
    .sym-cherry, .sym-lemon, .sym-bell, .sym-bar {
      color: var(--text-dim);
    }
    .sym-7 {
      color: var(--text);
      font-size: 28px;
      text-shadow: 2px 2px 0 var(--border-dim);
    }
    .sym-bonus {
      color: var(--border);
      text-shadow: 2px 2px 0 var(--border-dim);
      animation: glow 1s infinite;
    }
    @keyframes glow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .status-text {
      text-align: center;
      font-size: 14px;
      margin-bottom: 16px;
      min-height: 20px;
      letter-spacing: 1px;
      color: var(--text);
    }
    .controls-box {
      background: var(--panel);
      padding: 20px;
      border: 3px solid var(--border);
      text-align: center;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .balance-box {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      margin-bottom: 12px;
      font-size: 14px;
      border-bottom: 2px solid var(--border-dim);
    }
    .bonus-indicator {
      color: var(--text);
      font-size: 12px;
      margin-bottom: 12px;
      min-height: 20px;
      font-weight: 400;
      text-shadow: 1px 1px 0 var(--border-dim);
    }
    .paylines-info {
      color: var(--text-dim);
      font-size: 10px;
      margin-top: 16px;
      text-align: left;
      line-height: 1.6;
      border-top: 2px solid var(--border-dim);
      padding-top: 12px;
    }
    .label-text {
      display: block;
      text-align: left;
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }
    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 3px solid var(--border);
      background: var(--bg);
      color: var(--text);
      text-align: right;
      font-size: 16px;
      font-family: inherit;
      margin-top: 8px;
      margin-bottom: 16px;
      outline: none;
    }
    input[type="number"]:focus {
      border-color: var(--text);
    }
    .btn-spin {
      width: 100%;
      padding: 14px;
      border: 3px solid var(--border);
      font-size: 14px;
      cursor: pointer;
      color: var(--bg);
      background: var(--border);
      font-family: inherit;
      letter-spacing: 2px;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .btn-spin:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .btn-spin:disabled {
      opacity: 0.5;
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .btn-bonus {
      background: var(--panel-light);
      color: var(--text);
      animation: pulse-btn 1s infinite;
    }
    @keyframes pulse-btn {
      0%, 100% { box-shadow: 4px 4px 0 var(--border-dim); }
      50% { box-shadow: 4px 4px 0 var(--border); }
    }
    .history-box {
      background: var(--panel);
      padding: 16px;
      font-size: 11px;
      max-height: 150px;
      overflow-y: auto;
      color: var(--text-dim);
      margin-top: 16px;
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .history-box::-webkit-scrollbar {
      width: 8px;
    }
    .history-box::-webkit-scrollbar-track {
      background: var(--bg);
    }
    .history-box::-webkit-scrollbar-thumb {
      background: var(--border-dim);
    }
  </style>
</head>
<body>
  <audio id="bg-music" loop style="display:none;"></audio>
  <script>
  (function(){
    var u=localStorage.getItem('currentUser');
    if(!u)return;
    var d=localStorage.getItem('set_music_'+u);
    var v=parseInt(localStorage.getItem('set_volume_'+u))||50;
    var on=localStorage.getItem('set_music_on_'+u)!=='false';
    var a=document.getElementById('bg-music');
    var started=false;
    function startMusic(){
      if(started)return;
      if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
      started=true;
    }
    document.addEventListener('click',startMusic,{once:true});
    document.addEventListener('touchstart',startMusic,{once:true});
    if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
  })();
  </script>
  <div class="header"><a href="index.html" class="back-btn" onclick="localStorage.setItem('coming_back','true')">&lt;&lt; НАЗАД</a></div>
  <div class="game-container">
    <h1>СЛОТЫ 777</h1>
    <div class="status-text" id="status-text">КРУТИТЕ БАРАБАНЫ!</div>
    <div class="slots-wrapper">
      <div class="bonus-effect" id="bonus-effect"></div>
      <div class="bonus-particles" id="bonus-particles"></div>
      <div class="reel-container">
        <div class="reel"><div class="reel-content" id="content1"></div></div>
        <div class="reel-separator"></div>
        <div class="reel"><div class="reel-content" id="content2"></div></div>
        <div class="reel-separator"></div>
        <div class="reel"><div class="reel-content" id="content3"></div></div>
      </div>
    </div>
    <div class="controls-box">
      <div class="balance-box"><span>БАЛАНС</span><span id="balance-display">1000 РУБ</span></div>
      <div class="bonus-indicator" id="bonus-indicator"></div>
      <span class="label-text">СТАВКА НА ЛИНИЮ</span>
      <input type="number" id="bet-input" min="1" value="100" />
      <button class="btn-spin btn-normal" id="btn-spin">КРУТИТЬ</button>
      <div class="paylines-info">КОМБИНАЦИИ:<br>- ГОРИЗОНТАЛЬ = X2<br>- ВЕРТИКАЛЬ = X2<br>- ДИАГОНАЛЬ = X2<br>- 777 = X20<br>- 3 БОНУСА = X3 + 5 ФРИСПИНОВ</div>
    </div>
    <div class="history-box" id="history-box">ИСТОРИЯ РАУНДОВ</div>
  </div>
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyBKfDdHsbTzZjfc4hHX3SJV563UbVBvqPQ",
      authDomain: "lucky-finger-b8b05.firebaseapp.com",
      databaseURL: "https://lucky-finger-b8b05-default-rtdb.firebaseio.com",
      projectId: "lucky-finger-b8b05",
      storageBucket: "lucky-finger-b8b05.firebasestorage.app",
      messagingSenderId: "843623003093",
      appId: "1:843623003093:web:05acfb8aa828e6cc2e835c"
    };
    firebase.initializeApp(firebaseConfig);
    var database = firebase.database();
    var accountsCache = {};
    var currentUser = localStorage.getItem('currentUser');
    if (!currentUser) window.location.href = 'index.html';
    var balance = parseInt(localStorage.getItem('bal_' + currentUser)) || 1000;
    var bet = 0, isSpinning = false, bonusSpins = 0;
    var symbols = [
      {icon:'[C]',cls:'sym-cherry',w:25},
      {icon:'[L]',cls:'sym-lemon',w:25},
      {icon:'[B]',cls:'sym-bell',w:20},
      {icon:'[X]',cls:'sym-bar',w:15},
      {icon:'[7]',cls:'sym-7',w:10},
      {icon:'[D]',cls:'sym-bonus',w:5}
    ];
    var TOTAL = 30, VIS = 3, DUR = 2000, DELAY = 10;

    async function loadAcc() { try { var snapshot = await database.ref('accounts').get(); accountsCache = snapshot.val() || {}; } catch(e) {} }
    async function saveAcc() { try { await database.ref('accounts').set(accountsCache); } catch(e) {} }
    function saveBal() { localStorage.setItem('bal_' + currentUser, balance); document.getElementById('balance-display').textContent = balance.toLocaleString() + ' РУБ'; syncNow(); }
    async function syncNow() { if (accountsCache[currentUser]) { accountsCache[currentUser].balance = balance; await saveAcc(); } }
    function addHistory(text) { var box = document.getElementById('history-box'); if(!box) return; var div = document.createElement('div'); div.textContent = text; div.style.padding = '6px 0'; div.style.borderBottom = '2px solid var(--border-dim)'; box.insertBefore(div, box.firstChild); while(box.children.length > 20) { box.removeChild(box.lastChild); } }
    document.getElementById('balance-display').textContent = balance.toLocaleString() + ' РУБ';

    function getSym() { var t = symbols.reduce(function(s, x) { return s + x.w; }, 0); var r = Math.random() * t; for(var i = 0; i < symbols.length; i++) { r -= symbols[i].w; if(r <= 0) return symbols[i]; } return symbols[0]; }
    
    function upBonus() { 
      if(bonusSpins > 0) { 
        document.getElementById('bonus-indicator').textContent = 'ФРИСПИНЫ: ' + bonusSpins; 
        document.getElementById('btn-spin').textContent = 'КРУТИТЬ БЕСПЛАТНО'; 
        document.getElementById('btn-spin').className = 'btn-spin btn-bonus'; 
      } else { 
        document.getElementById('bonus-indicator').textContent = ''; 
        document.getElementById('btn-spin').textContent = 'КРУТИТЬ'; 
        document.getElementById('btn-spin').className = 'btn-spin btn-normal'; 
      } 
    }
    
    function triggerBonus() { 
      document.getElementById('bonus-effect').classList.add('active'); 
      var p = ['+','*','!','X','O']; 
      for(var i = 0; i < 20; i++) { 
        var el = document.createElement('div'); 
        el.className = 'particle'; 
        el.textContent = p[Math.floor(Math.random() * p.length)]; 
        el.style.left = Math.random() * 90 + '%'; 
        el.style.animationDuration = (1.5 + Math.random() * 2) + 's'; 
        el.style.animationDelay = Math.random() * 0.5 + 's'; 
        el.style.fontSize = (16 + Math.random() * 20) + 'px'; 
        document.getElementById('bonus-particles').appendChild(el); 
        setTimeout(function() { el.remove(); }, 3000); 
      } 
      setTimeout(function() { document.getElementById('bonus-effect').classList.remove('active'); }, 800); 
    }
    
    function gen() { 
      var h = ''; 
      for(var i = 0; i < TOTAL; i++) { 
        var s = getSym(); 
        h += '<div class="symbol ' + s.cls + '">' + s.icon + '</div>'; 
      } 
      return h; 
    }
    
    function initReels() { 
      ['content1','content2','content3'].forEach(function(id) { 
        document.getElementById(id).innerHTML = gen(); 
        setPos(document.getElementById(id), 0); 
      }); 
    }
    
    function setPos(c, t) { 
      c.style.transform = 'translateY(' + (-t * c.children[0].offsetHeight) + 'px)'; 
    }
    
    function getGrid() { 
      var cont = ['content1','content2','content3'].map(function(id) { return document.getElementById(id); }); 
      var g = []; 
      for(var col = 0; col < 3; col++) { 
        g[col] = []; 
        var si = +cont[col].dataset.stopIndex; 
        for(var r = 0; r < VIS; r++) { 
          g[col][r] = cont[col].children[si + r].className.split(' ').find(function(c) { return c.startsWith('sym-'); }); 
        } 
      } 
      return g; 
    }
    
    function checkWins(g) { 
      var w = []; 
      for(var r = 0; r < 3; r++) { 
        if(g[0][r] && g[0][r] === g[1][r] && g[1][r] === g[2][r]) w.push({t:'h',r:r,cls:g[0][r],mult:g[0][r]==='sym-7'?20:g[0][r]==='sym-bonus'?3:2}); 
      } 
      for(var c = 0; c < 3; c++) { 
        if(g[c][0] && g[c][0] === g[c][1] && g[c][1] === g[c][2]) w.push({t:'v',c:c,cls:g[c][0],mult:g[c][0]==='sym-7'?20:g[c][0]==='sym-bonus'?3:2}); 
      } 
      if(g[0][0] && g[0][0] === g[1][1] && g[1][1] === g[2][2]) w.push({t:'dd',cls:g[0][0],mult:g[0][0]==='sym-7'?20:g[0][0]==='sym-bonus'?3:2}); 
      if(g[0][2] && g[0][2] === g[1][1] && g[1][1] === g[2][0]) w.push({t:'du',cls:g[0][2],mult:g[0][2]==='sym-7'?20:g[0][2]==='sym-bonus'?3:2}); 
      return {wins:w}; 
    }

    document.getElementById('btn-spin').onclick = function() {
      if(isSpinning) return;
      var free = bonusSpins > 0;
      if(!free) { 
        bet = +document.getElementById('bet-input').value; 
        if(!bet || bet <= 0 || bet > balance) { alert('НЕКОРРЕКТНАЯ СТАВКА'); return; } 
        balance -= bet; saveBal(); 
      }
      else { bonusSpins--; upBonus(); }
      isSpinning = true; 
      document.getElementById('bet-input').disabled = true; 
      document.getElementById('btn-spin').disabled = true;
      document.getElementById('status-text').textContent = free ? 'БОНУСНОЕ ВРАЩЕНИЕ!' : 'КРУТИМ...'; 
      document.getElementById('status-text').style.color = 'var(--text)';
      
      var cont = ['content1','content2','content3'].map(function(id) { return document.getElementById(id); });
      var si = []; 
      for(var i = 0; i < 3; i++) si.push(Math.floor(Math.random() * (TOTAL - VIS)));
      
      cont.forEach(function(c, i) { 
        c.style.transition = 'none'; 
        c.style.transform = 'translateY(0)'; 
        void c.offsetWidth; 
        c.style.transition = 'transform ' + ((DUR + i * DELAY) / 1000) + 's cubic-bezier(0.2,0.8,0.2,1)'; 
        c.style.transform = 'translateY(' + (-si[i] * c.children[0].offsetHeight) + 'px)'; 
        c.dataset.stopIndex = si[i]; 
      });
      
      setTimeout(function() {
        isSpinning = false; 
        document.getElementById('bet-input').disabled = false; 
        document.getElementById('btn-spin').disabled = false;
        var g = getGrid(); 
        var wins = checkWins(g).wins; 
        var bonusFrom = false;
        
        wins.forEach(function(w) { if(w.cls === 'sym-bonus') bonusFrom = true; });
        
        if(bonusFrom) { 
          bonusSpins += 5; 
          triggerBonus(); 
          addHistory('БОНУС! +5 ФРИСПИНОВ'); 
        } 
        upBonus();
        
        var total = 0, result = '', color = 'var(--text)';
        
        if(wins.length > 0) { 
          var d = []; 
          wins.forEach(function(w) { 
            var desc = w.t === 'h' ? 'ЛИНИЯ ' + (w.r + 1) : w.t === 'v' ? 'СТОЛБЕЦ ' + (w.c + 1) : w.t === 'dd' ? 'ДИАГ ↘' : 'ДИАГ ↗'; 
            total += (free ? bet : bet) * w.mult; 
            d.push(desc + ' X' + w.mult); 
          }); 
          result = 'ВЫИГРЫШ: ' + d.join(' + '); 
          color = 'var(--text)'; 
          addHistory('СЛОТЫ: ' + result + ' = +' + total + ' РУБ'); 
        }
        else { 
          result = free ? 'БЕСПЛАТНОЕ ВРАЩЕНИЕ' : 'НЕ ПОВЕЗЛО'; 
          color = 'var(--text-dim)'; 
          if(!free) addHistory('СЛОТЫ: ПРОИГРЫШ -' + bet + ' РУБ'); 
        }
        
        balance += total; 
        saveBal(); 
        document.getElementById('status-text').textContent = result + (bonusSpins > 0 ? ' | БОНУС!' : ''); 
        document.getElementById('status-text').style.color = bonusSpins > 0 ? 'var(--border)' : color;
      }, DUR + 2 * DELAY + 100);
    };

    initReels(); 
    upBonus();
    window.addEventListener('resize', function() { if(!isSpinning) initReels(); });
    (async function() { await loadAcc(); })();
  </script>
</body>
  </html>
