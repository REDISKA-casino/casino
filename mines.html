<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Минное поле</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    @font-face {
      font-family: 'PixelFont';
      src: url('pixel-font.ttf') format('truetype');
      font-display: swap;
    }
    :root {
      --bg: #0a0a0a;
      --panel: #1a1a1a;
      --panel-light: #2a2a2a;
      --text: #ffffff;
      --text-dim: #888888;
      --border: #e0e0e0;
      --border-dim: #444444;
      --cell-bg: #0a0a0a;
      --cell-safe: #2a2a2a;
      --cell-mine: #444444;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'PixelFont', 'Courier New', monospace;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }
    .header {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 0 16px;
    }
    .back-btn {
      background: var(--panel-light);
      color: var(--text);
      border: 3px solid var(--border);
      padding: 10px 16px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 3px 3px 0 var(--border-dim);
    }
    .back-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border-dim);
    }
    .balance-header {
      background: var(--panel);
      color: var(--text);
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 400;
      border: 3px solid var(--border);
      box-shadow: 3px 3px 0 var(--border-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    h1 {
      margin: 16px 0;
      font-weight: 400;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 var(--border-dim);
      text-align: center;
    }
    .game-container {
      width: 100%;
      max-width: 500px;
      padding: 16px;
    }
    .controls-box {
      background: var(--panel);
      padding: 16px;
      border: 3px solid var(--border);
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .stat-item {
      text-align: center;
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .stat-value {
      display: block;
      font-weight: 400;
      font-size: 14px;
      margin-top: 6px;
      color: var(--text);
    }
    .settings-box {
      background: var(--panel);
      padding: 20px;
      border: 3px solid var(--border);
      margin-bottom: 16px;
      text-align: center;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .setting-item {
      text-align: left;
      max-width: 200px;
      margin: 0 auto;
    }
    .setting-label {
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .setting-input {
      width: 100%;
      padding: 10px;
      border: 3px solid var(--border);
      background: var(--bg);
      color: var(--text);
      text-align: center;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .setting-input:focus {
      border-color: var(--text);
    }
    .reward-info {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 16px;
      text-transform: uppercase;
    }
    .board-wrapper {
      position: relative;
      width: 100%;
      background: var(--panel);
      border: 3px solid var(--border);
      padding: 8px;
      box-shadow: 4px 4px 0 var(--border-dim);
      margin-bottom: 16px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
      user-select: none;
      width: 100%;
      aspect-ratio: 1 / 1;
    }
    .cell {
      background: var(--cell-bg);
      border: 2px solid var(--border-dim);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 400;
      color: var(--text);
      font-size: 10px;
    }
    .cell.revealed-safe {
      background: var(--cell-safe);
      cursor: default;
      border-color: var(--border);
    }
    .cell.revealed-mine {
      background: var(--cell-mine);
      cursor: default;
      color: var(--text);
    }
    .bet-input {
      width: 100%;
      padding: 12px;
      border: 3px solid var(--border);
      background: var(--bg);
      color: var(--text);
      text-align: center;
      font-size: 16px;
      font-family: inherit;
      margin-bottom: 16px;
      outline: none;
    }
    .bet-input:focus {
      border-color: var(--text);
    }
    .btn-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .btn {
      flex: 1;
      padding: 14px 4px;
      border: 3px solid var(--border);
      font-size: 12px;
      cursor: pointer;
      font-weight: 400;
      color: var(--text);
      background: var(--panel-light);
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .btn:disabled {
      opacity: 0.5;
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .btn-start {
      background: var(--border);
      color: var(--bg);
    }
    .btn-cashout {
      background: var(--bg);
      color: var(--text);
      display: none;
    }
    .history-box {
      background: var(--panel);
      padding: 16px;
      font-size: 11px;
      max-height: 150px;
      overflow-y: auto;
      color: var(--text-dim);
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border-dim);
      text-transform: uppercase;
    }
    .history-box::-webkit-scrollbar {
      width: 8px;
    }
    .history-box::-webkit-scrollbar-track {
      background: var(--bg);
    }
    .history-box::-webkit-scrollbar-thumb {
      background: var(--border-dim);
    }
  </style>
</head>
<body>
  <audio id="bg-music" loop style="display:none;"></audio>
  <script>
  (function(){
    var u=localStorage.getItem('currentUser');
    if(!u)return;
    var d=localStorage.getItem('set_music_'+u);
    var v=parseInt(localStorage.getItem('set_volume_'+u))||50;
    var on=localStorage.getItem('set_music_on_'+u)!=='false';
    var a=document.getElementById('bg-music');
    var started=false;
    function startMusic(){
      if(started)return;
      if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
      started=true;
    }
    document.addEventListener('click',startMusic,{once:true});
    document.addEventListener('touchstart',startMusic,{once:true});
    if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
  })();
  </script>
  <div class="header">
    <a href="index.html" class="back-btn" onclick="localStorage.setItem('coming_back','true')">&lt;&lt; НАЗАД</a>
    <span class="balance-header" id="header-balance">1000 РУБ</span>
  </div>
  <div class="game-container">
    <h1>МИННОЕ ПОЛЕ</h1>
    <div class="controls-box">
      <div class="stat-item">МИНЫ<span class="stat-value" id="mines-count">15</span></div>
      <div class="stat-item">ВЫИГРЫШ<span class="stat-value" id="win-display">0 РУБ</span></div>
      <div class="stat-item">БАЛАНС<span class="stat-value" id="balance-display">1000 РУБ</span></div>
    </div>
    <div class="settings-box">
      <div class="setting-item">
        <div class="setting-label">КОЛ-ВО МИН (1-80)</div>
        <input type="number" class="setting-input" id="mines-input" min="1" max="80" value="15" />
      </div>
      <div class="reward-info" id="reward-info">НАГРАДА ЗА КЛЕТКУ: 2 РУБ</div>
    </div>
    <div class="board-wrapper">
      <div class="board" id="board"></div>
    </div>
    <input type="number" class="bet-input" id="bet-input" min="1" value="50" placeholder="СТАВКА" />
    <div class="btn-row">
      <button class="btn btn-start" id="btn-start">ИГРАТЬ</button>
      <button class="btn btn-cashout" id="btn-cashout">ВЫВЕСТИ</button>
    </div>
    <div class="history-box" id="history-box">ИСТОРИЯ ИГР</div>
  </div>
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyBKfDdHsbTzZjfc4hHX3SJV563UbVBvqPQ",
      authDomain: "lucky-finger-b8b05.firebaseapp.com",
      databaseURL: "https://lucky-finger-b8b05-default-rtdb.firebaseio.com",
      projectId: "lucky-finger-b8b05",
      storageBucket: "lucky-finger-b8b05.firebasestorage.app",
      messagingSenderId: "843623003093",
      appId: "1:843623003093:web:05acfb8aa828e6cc2e835c"
    };
    firebase.initializeApp(firebaseConfig);
    var database = firebase.database();
    var accountsCache = {};
    var currentUser = localStorage.getItem('currentUser');
    if (!currentUser) window.location.href = 'index.html';
    var balance = parseInt(localStorage.getItem('bal_' + currentUser)) || 1000;
    var gameActive = false, gameStarted = false, currentBet = 0, currentWinAmount = 0, minesCount = 15, rewardPerCell = 2;
    var minePositions = {}, revealedCells = {};
    var TOTAL_CELLS = 100;

    async function loadAcc() { try { var snapshot = await database.ref('accounts').get(); accountsCache = snapshot.val() || {}; } catch(e) {} }
    async function saveAcc() { try { await database.ref('accounts').set(accountsCache); } catch(e) {} }
    function saveBal() { localStorage.setItem('bal_' + currentUser, balance); updateDisplay(); syncNow(); }
    async function syncNow() { if (accountsCache[currentUser]) { accountsCache[currentUser].balance = balance; await saveAcc(); } }
    function updateDisplay() { 
      document.getElementById('balance-display').textContent = balance.toLocaleString() + ' РУБ'; 
      document.getElementById('header-balance').textContent = balance.toLocaleString() + ' РУБ'; 
      document.getElementById('win-display').textContent = currentWinAmount.toLocaleString() + ' РУБ'; 
    }
    function calculateReward(m) { return Math.floor(2 + (m / 10)); }
    function updateRewardDisplay() { 
      document.getElementById('reward-info').textContent = 'НАГРАДА ЗА КЛЕТКУ: ' + calculateReward(+document.getElementById('mines-input').value || 15) + ' РУБ'; 
    }
    document.getElementById('mines-input').addEventListener('input', updateRewardDisplay);
    function addHistory(text) { 
      var box = document.getElementById('history-box'); 
      if(!box) return; 
      var div = document.createElement('div'); 
      div.textContent = text; 
      div.style.padding = '6px 0'; 
      div.style.borderBottom = '2px solid var(--border-dim)'; 
      box.insertBefore(div, box.firstChild); 
      while(box.children.length > 20) { box.removeChild(box.lastChild); } 
    }
    function createBoard() { 
      var board = document.getElementById('board'); 
      board.innerHTML = ''; 
      for(var i = 0; i < TOTAL_CELLS; i++) { 
        var c = document.createElement('div'); 
        c.className = 'cell'; 
        c.dataset.index = i; 
        c.textContent = '[ ]'; 
        (function(idx) { c.addEventListener('click', function() { handleClick(idx); }); })(i); 
        board.appendChild(c); 
      } 
    }
    function generateMines() { 
      minePositions = {}; 
      var max = Math.min(minesCount, 99); 
      var placed = 0; 
      while(placed < max) { 
        var pos = Math.floor(Math.random() * TOTAL_CELLS); 
        if(!minePositions[pos]) { minePositions[pos] = true; placed++; } 
      } 
    }

    document.getElementById('btn-start').onclick = function() {
      if(gameStarted) return;
      currentBet = +document.getElementById('bet-input').value;
      if(!currentBet || currentBet <= 0 || currentBet > balance) { alert('НЕКОРРЕКТНАЯ СТАВКА'); return; }
      minesCount = Math.min(Math.max(+document.getElementById('mines-input').value || 15, 1), 80);
      rewardPerCell = calculateReward(minesCount);
      document.getElementById('mines-input').disabled = true;
      document.getElementById('mines-count').textContent = minesCount;
      balance -= currentBet; saveBal();
      createBoard(); minePositions = {}; revealedCells = {}; generateMines();
      gameStarted = true; gameActive = true; currentWinAmount = 0; updateDisplay();
      document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-cashout').style.display = 'block';
    };

    function handleClick(i) {
      if(!gameActive || revealedCells[i]) return;
      var cell = document.querySelector('.cell[data-index="' + i + '"]');
      if(minePositions[i]) {
        cell.classList.add('revealed-mine'); cell.textContent = '[X]'; revealAll();
        gameActive = false; gameStarted = false; currentWinAmount = 0; updateDisplay();
        addHistory('МИНА! -' + currentBet + ' РУБ');
        document.getElementById('btn-start').style.display = 'block'; document.getElementById('btn-cashout').style.display = 'none'; document.getElementById('mines-input').disabled = false;
        return;
      }
      cell.classList.add('revealed-safe'); cell.textContent = '[O]'; revealedCells[i] = true; currentWinAmount += rewardPerCell; updateDisplay();
      var safeCells = TOTAL_CELLS - minesCount;
      if(Object.keys(revealedCells).length === safeCells) {
        gameActive = false; gameStarted = false; balance += currentWinAmount; saveBal();
        addHistory('ВСЁ ОТКРЫТО! +' + currentWinAmount + ' РУБ');
        document.getElementById('btn-start').style.display = 'block'; document.getElementById('btn-cashout').style.display = 'none'; document.getElementById('mines-input').disabled = false;
        revealAll();
      }
    }

    document.getElementById('btn-cashout').onclick = function() {
      if(!gameActive) return;
      gameActive = false; gameStarted = false; balance += currentWinAmount; saveBal();
      addHistory('ВЫВОД: +' + currentWinAmount + ' РУБ');
      document.getElementById('btn-start').style.display = 'block'; document.getElementById('btn-cashout').style.display = 'none'; document.getElementById('mines-input').disabled = false;
      revealAll(); updateDisplay();
    };

    function revealAll() {
      for(var pos in minePositions) {
        var cell = document.querySelector('.cell[data-index="' + pos + '"]');
        if(cell && !cell.classList.contains('revealed-mine')) { 
          cell.classList.add('revealed-mine'); 
          cell.textContent = '[X]'; 
        }
      }
    }

    updateDisplay(); createBoard(); updateRewardDisplay();
    (async function() { await loadAcc(); })();
  </script>
</body>
  </html>
