<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Настройки</title>
  <style>
    :root { --bg: #121212; --panel: #1e1e1e; --text: #e0e0e0; --accent: #ff4757; --gold: #ffd700; --success: #2ed573; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; box-sizing: border-box; }
    .container { width: 100%; max-width: 500px; background: var(--panel); padding: 24px; border-radius: 16px; border: 2px solid #333; }
    h1 { font-weight: 400; text-align: center; font-size: 24px; color: var(--gold); margin-bottom: 20px; }
    .setting-item { padding: 14px 0; border-bottom: 1px solid #2a2a2a; }
    .setting-label { font-size: 16px; margin-bottom: 8px; }
    .setting-desc { font-size: 12px; color: #aaa; margin-bottom: 8px; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; }
    .toggle-switch { position: relative; width: 50px; height: 28px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #555; border-radius: 28px; transition: 0.3s; }
    .toggle-slider:before { content: ""; position: absolute; height: 22px; width: 22px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s; }
    input:checked + .toggle-slider { background: var(--accent); }
    input:checked + .toggle-slider:before { transform: translateX(22px); }
    .music-select { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 8px; background: #000; color: #fff; font-size: 16px; box-sizing: border-box; margin-top: 8px; }
    .volume-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .volume-slider { flex: 1; -webkit-appearance: none; height: 6px; background: #555; border-radius: 3px; outline: none; }
    .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: var(--accent); border-radius: 50%; cursor: pointer; }
    .volume-value { font-size: 14px; color: var(--gold); min-width: 40px; text-align: right; }
    .back-btn { display: block; text-align: center; margin-top: 24px; background: var(--accent); color: white; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <audio id="bg-music" loop style="display:none;"></audio>
  <script>
  (function(){
    var u=localStorage.getItem('currentUser');
    if(!u)return;
    var d=localStorage.getItem('set_music_'+u);
    var v=parseInt(localStorage.getItem('set_volume_'+u))||50;
    var on=localStorage.getItem('set_music_on_'+u)!=='false';
    var a=document.getElementById('bg-music');
    var started=false;
    function startMusic(){
      if(started)return;
      if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
      started=true;
    }
    document.addEventListener('click',startMusic,{once:true});
    document.addEventListener('touchstart',startMusic,{once:true});
    if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
    window.addEventListener('storage',function(e){
      if(e.key==='set_volume_'+u)a.volume=(parseInt(e.newValue)||50)/100;
      if(e.key==='set_music_'+u){a.src=e.newValue||'';if(e.newValue&&e.newValue!=='none')a.play().catch(function(){});else a.pause();}
      if(e.key==='set_music_on_'+u){if(e.newValue==='false')a.pause();else a.play().catch(function(){});}
    });
  })();
  </script>
  <div class="container">
    <h1>⚙️ Настройки</h1>
    
    <div class="setting-item">
      <div class="setting-label">🔊 Звуки</div>
      <div class="setting-desc">Звуковые эффекты в играх</div>
      <div class="setting-row">
        <span></span>
        <label class="toggle-switch"><input type="checkbox" id="sound-toggle" checked onchange="saveCheckbox('sound', this.checked)"><span class="toggle-slider"></span></label>
      </div>
    </div>
    
    <div class="setting-item">
      <div class="setting-label">🎵 Музыка</div>
      <div class="setting-desc">Выберите фоновую музыку</div>
      <select class="music-select" id="music-select" onchange="changeMusic(this.value)">
        <option value="none">🔇 Ничего</option>
        <option value="https://rediska-casino.github.io/casino/music/1.mp3">🎵 Трек 1</option>
        <option value="https://rediska-casino.github.io/casino/music/2.mp3">🎵 Трек 2</option>
        <option value="https://rediska-casino.github.io/casino/music/3.mp3">🎵 Трек 3</option>
        <option value="https://rediska-casino.github.io/casino/music/4.mp3">🎵 Трек 4</option>
        <option value="https://rediska-casino.github.io/casino/music/5.mp3">🎵 Трек 5</option>
        <option value="https://rediska-casino.github.io/casino/music/6.mp3">🎵 Трек 6</option>
      </select>
      <div class="volume-row">
        <span>🔈</span>
        <input type="range" class="volume-slider" id="volume-slider" min="1" max="100" value="50" oninput="changeVolume(this.value)">
        <span class="volume-value" id="volume-value">50%</span>
      </div>
    </div>
    
    <div class="setting-item">
      <div class="setting-label">🔔 Уведомления</div>
      <div class="setting-desc">Уведомления о выигрышах</div>
      <div class="setting-row">
        <span></span>
        <label class="toggle-switch"><input type="checkbox" id="notify-toggle" checked onchange="saveCheckbox('notify', this.checked)"><span class="toggle-slider"></span></label>
      </div>
    </div>
    
    <div class="setting-item">
      <div class="setting-label">📊 Статистика</div>
      <div class="setting-desc">Показывать статистику игр</div>
      <div class="setting-row">
        <span></span>
        <label class="toggle-switch"><input type="checkbox" id="stats-toggle" checked onchange="saveCheckbox('stats', this.checked)"><span class="toggle-slider"></span></label>
      </div>
    </div>

    <div class="setting-item">
      <div class="setting-label">🎨 Тема</div>
      <div class="setting-desc">Тёмная тема (всегда включена)</div>
      <div class="setting-row">
        <span></span>
        <label class="toggle-switch"><input type="checkbox" checked disabled><span class="toggle-slider"></span></label>
      </div>
    </div>

    <div class="setting-item">
      <div class="setting-label">🌐 Язык</div>
      <div class="setting-desc">Русский</div>
      <div class="setting-row">
        <span></span>
        <span style="color:#aaa;">RU 🇷🇺</span>
      </div>
    </div>

    <a href="index.html" class="back-btn">← На главную</a>
  </div>
  <script>
    var currentUser = localStorage.getItem('currentUser');
    
    function loadSettings() {
      var sound = localStorage.getItem('set_sound_' + currentUser);
      var notify = localStorage.getItem('set_notify_' + currentUser);
      var stats = localStorage.getItem('set_stats_' + currentUser);
      var volume = localStorage.getItem('set_volume_' + currentUser);
      var music = localStorage.getItem('set_music_' + currentUser);
      
      if (sound !== null) document.getElementById('sound-toggle').checked = sound === 'true';
      if (notify !== null) document.getElementById('notify-toggle').checked = notify === 'true';
      if (stats !== null) document.getElementById('stats-toggle').checked = stats === 'true';
      
      if (volume !== null) {
        document.getElementById('volume-slider').value = volume;
        document.getElementById('volume-value').textContent = volume + '%';
      }
      
      if (music) {
        document.getElementById('music-select').value = music;
      }
    }
    
    function saveCheckbox(name, value) {
      localStorage.setItem('set_' + name + '_' + currentUser, value);
    }
    
    function changeMusic(value) {
      localStorage.setItem('set_music_' + currentUser, value);
      var a = document.getElementById('bg-music');
      if (value === 'none') {
        a.pause();
        a.src = '';
      } else {
        a.src = value;
        a.volume = (parseInt(localStorage.getItem('set_volume_' + currentUser)) || 50) / 100;
        a.play().catch(function(){});
      }
    }
    
    function changeVolume(val) {
      document.getElementById('volume-value').textContent = val + '%';
      localStorage.setItem('set_volume_' + currentUser, val);
      var a = document.getElementById('bg-music');
      a.volume = val / 100;
    }
    
    loadSettings();
  </script>
</body>
  </html>
