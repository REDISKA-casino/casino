<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Настройки</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    @font-face {
      font-family: 'PixelFont';
      src: url('pixel-font.ttf') format('truetype');
      font-display: swap;
    }
    :root {
      --bg: #0a0a0a;
      --panel: #1a1a1a;
      --panel-light: #2a2a2a;
      --text: #ffffff;
      --text-dim: #888888;
      --border: #e0e0e0;
      --border-dim: #444444;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'PixelFont', 'Courier New', monospace;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background: var(--panel);
      padding: 24px;
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    h1 {
      font-weight: 400;
      text-align: center;
      font-size: 18px;
      color: var(--text);
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 var(--border-dim);
    }
    .setting-item {
      padding: 16px 0;
      border-bottom: 3px solid var(--border-dim);
    }
    .setting-item:last-of-type {
      border-bottom: none;
    }
    .setting-label {
      font-size: 14px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .setting-desc {
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      cursor: pointer;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg);
      border: 3px solid var(--border);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .toggle-slider:before {
      content: "[ ]";
      position: absolute;
      height: 100%; width: 100%;
      display: flex; justify-content: center; align-items: center;
      font-size: 10px; color: var(--text-dim);
      font-family: inherit;
    }
    input:checked + .toggle-slider {
      background: var(--border);
    }
    input:checked + .toggle-slider:before {
      content: "[X]";
      color: var(--bg);
    }

    .music-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }
    .music-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg);
      border: 3px solid var(--border);
      box-shadow: 3px 3px 0 var(--border-dim);
    }
    .music-icon {
      font-size: 12px;
      width: 36px;
      text-align: center;
      color: var(--text);
      font-weight: 400;
    }
    .music-info {
      flex: 1;
    }
    .music-name {
      font-size: 12px;
      font-weight: 400;
      text-transform: uppercase;
    }
    .music-price {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 4px;
      text-transform: uppercase;
    }
    .music-btn {
      padding: 8px 12px;
      border: 3px solid var(--border);
      font-size: 10px;
      cursor: pointer;
      font-weight: 400;
      white-space: nowrap;
      font-family: inherit;
      text-transform: uppercase;
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .music-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }
    .btn-buy {
      background: var(--border);
      color: var(--bg);
    }
    .btn-select {
      background: var(--panel-light);
      color: var(--text);
    }
    .btn-selected {
      background: var(--bg);
      color: var(--text-dim);
      border-color: var(--border-dim);
      box-shadow: none;
      transform: translate(2px, 2px);
    }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }
    .volume-row span:first-child, .volume-row span:last-child {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .volume-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 12px;
      background: var(--bg);
      border: 3px solid var(--border);
      outline: none;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: var(--border);
      cursor: pointer;
      border-radius: 0;
    }
    .volume-value {
      font-size: 12px;
      color: var(--text);
      min-width: 40px;
      text-align: right;
    }

    .back-btn {
      display: block;
      text-align: center;
      margin-top: 24px;
      background: var(--panel-light);
      color: var(--text);
      padding: 14px;
      border: 3px solid var(--border);
      text-decoration: none;
      font-weight: 400;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .back-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
  </style>
</head>
<body>
  <audio id="bg-music" loop style="display:none;"></audio>
  <script>
  (function(){
    var u=localStorage.getItem('currentUser');
    if(!u)return;
    var d=localStorage.getItem('set_music_'+u);
    var v=parseInt(localStorage.getItem('set_volume_'+u))||50;
    var on=localStorage.getItem('set_music_on_'+u)!=='false';
    var a=document.getElementById('bg-music');
    var started=false;
    function startMusic(){
      if(started)return;
      if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
      started=true;
    }
    document.addEventListener('click',startMusic,{once:true});
    document.addEventListener('touchstart',startMusic,{once:true});
    if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
  })();
  </script>
  <div class="container">
    <h1>НАСТРОЙКИ</h1>
    
    <div class="setting-item">
      <div class="setting-label">ЗВУКИ</div>
      <div class="setting-desc">ЗВУКОВЫЕ ЭФФЕКТЫ В ИГРАХ</div>
      <div class="setting-row">
        <span></span>
        <label class="toggle-switch"><input type="checkbox" id="sound-toggle" checked onchange="saveCheckbox('sound', this.checked)"><span class="toggle-slider"></span></label>
      </div>
    </div>
    
    <div class="setting-item">
      <div class="setting-label">МУЗЫКА</div>
      <div class="setting-desc">ПОКУПАЙТЕ МУЗЫКУ ЗА ИГРОВУЮ ВАЛЮТУ</div>
      <div class="music-list" id="music-list"></div>
      <div class="volume-row">
        <span>VOL</span>
        <input type="range" class="volume-slider" id="volume-slider" min="1" max="100" value="50" oninput="changeVolume(this.value)">
        <span class="volume-value" id="volume-value">50%</span>
      </div>
    </div>
    
    <div class="setting-item">
      <div class="setting-label">УВЕДОМЛЕНИЯ</div>
      <div class="setting-desc">УВЕДОМЛЕНИЯ О ВЫИГРЫШАХ</div>
      <div class="setting-row">
        <span></span>
        <label class="toggle-switch"><input type="checkbox" id="notify-toggle" checked onchange="saveCheckbox('notify', this.checked)"><span class="toggle-slider"></span></label>
      </div>
    </div>
    
    <div class="setting-item">
      <div class="setting-label">СТАТИСТИКА</div>
      <div class="setting-desc">ПОКАЗЫВАТЬ СТАТИСТИКУ ИГР</div>
      <div class="setting-row">
        <span></span>
        <label class="toggle-switch"><input type="checkbox" id="stats-toggle" checked onchange="saveCheckbox('stats', this.checked)"><span class="toggle-slider"></span></label>
      </div>
    </div>

    <div class="setting-item">
      <div class="setting-label">ТЕМА</div>
      <div class="setting-desc">ТЁМНАЯ ТЕМА (ВСЕГДА ВКЛЮЧЕНА)</div>
      <div class="setting-row">
        <span></span>
        <label class="toggle-switch"><input type="checkbox" checked disabled><span class="toggle-slider"></span></label>
      </div>
    </div>

    <div class="setting-item">
      <div class="setting-label">ЯЗЫК</div>
      <div class="setting-desc">РУССКИЙ</div>
      <div class="setting-row">
        <span></span>
        <span style="color:var(--text-dim); font-size:12px;">RU</span>
      </div>
    </div>

    <a href="index.html" class="back-btn">&lt;&lt; НА ГЛАВНУЮ</a>
  </div>
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyBKfDdHsbTzZjfc4hHX3SJV563UbVBvqPQ",
      authDomain: "lucky-finger-b8b05.firebaseapp.com",
      databaseURL: "https://lucky-finger-b8b05-default-rtdb.firebaseio.com",
      projectId: "lucky-finger-b8b05",
      storageBucket: "lucky-finger-b8b05.firebasestorage.app",
      messagingSenderId: "843623003093",
      appId: "1:843623003093:web:05acfb8aa828e6cc2e835c"
    };
    firebase.initializeApp(firebaseConfig);
    var database = firebase.database();
    var accountsCache = {};
    var currentUser = localStorage.getItem('currentUser');
    if (!currentUser) window.location.href = 'index.html';
    
    var musicList = [
      { id: 'none', name: 'НИЧЕГО', icon: '[OFF]', url: 'none', price: 0 },
      { id: '1', name: 'ТРЕК 1', icon: '[MUS]', url: 'https://rediska-casino.github.io/casino/music/1.mp3', price: 2000 },
      { id: '2', name: 'ТРЕК 2', icon: '[MUS]', url: 'https://rediska-casino.github.io/casino/music/2.mp3', price: 2000 },
      { id: '3', name: 'ТРЕК 3', icon: '[MUS]', url: 'https://rediska-casino.github.io/casino/music/3.mp3', price: 2000 },
      { id: '4', name: 'ТРЕК 4', icon: '[MUS]', url: 'https://rediska-casino.github.io/casino/music/4.mp3', price: 2000 },
      { id: '5', name: 'ТРЕК 5', icon: '[MUS]', url: 'https://rediska-casino.github.io/casino/music/5.mp3', price: 2000 },
      { id: '6', name: 'ТРЕК 6', icon: '[MUS]', url: 'https://rediska-casino.github.io/casino/music/6.mp3', price: 2000 }
    ];

    async function loadAcc() {
      try { var snapshot = await database.ref('accounts').get(); accountsCache = snapshot.val() || {}; } catch(e) {}
    }

    async function saveAcc() {
      try { await database.ref('accounts').set(accountsCache); } catch(e) {}
    }

    function getUserBalance() {
      return accountsCache[currentUser] ? (accountsCache[currentUser].balance || 0) : 0;
    }

    function getUserMusic() {
      return accountsCache[currentUser] ? (accountsCache[currentUser].ownedMusic || []) : [];
    }

    function renderMusicList() {
      var owned = getUserMusic();
      var selected = localStorage.getItem('set_music_' + currentUser) || 'none';
      var container = document.getElementById('music-list');
      
      container.innerHTML = musicList.map(function(m) {
        if (m.id === 'none') {
          var isSelected = selected === 'none';
          return '<div class="music-item">' +
            '<div class="music-icon">' + m.icon + '</div>' +
            '<div class="music-info"><div class="music-name">' + m.name + '</div><div class="music-price">БЕЗ МУЗЫКИ</div></div>' +
            (isSelected ? '<button class="music-btn btn-selected" disabled>[OK]</button>' : '<button class="music-btn btn-select" onclick="selectMusic(\'none\')">ВЫБРАТЬ</button>') +
            '</div>';
        }
        
        var isOwned = owned.indexOf(m.id) !== -1;
        var isSelected = selected === m.url;
        
        if (isSelected) {
          return '<div class="music-item">' +
            '<div class="music-icon">' + m.icon + '</div>' +
            '<div class="music-info"><div class="music-name">' + m.name + '</div><div class="music-price">ВЫБРАНО</div></div>' +
            '<button class="music-btn btn-selected" disabled>[OK]</button>' +
            '</div>';
        } else if (isOwned) {
          return '<div class="music-item">' +
            '<div class="music-icon">' + m.icon + '</div>' +
            '<div class="music-info"><div class="music-name">' + m.name + '</div><div class="music-price">КУПЛЕНО</div></div>' +
            '<button class="music-btn btn-select" onclick="selectMusic(\'' + m.id + '\')">ВЫБРАТЬ</button>' +
            '</div>';
        } else {
          return '<div class="music-item">' +
            '<div class="music-icon">' + m.icon + '</div>' +
            '<div class="music-info"><div class="music-name">' + m.name + '</div><div class="music-price">' + m.price.toLocaleString() + ' РУБ</div></div>' +
            '<button class="music-btn btn-buy" onclick="buyMusic(\'' + m.id + '\')">КУПИТЬ</button>' +
            '</div>';
        }
      }).join('');
    }

    window.buyMusic = async function(id) {
      var music = musicList.find(function(m) { return m.id === id; });
      if (!music) return;
      
      var balance = getUserBalance();
      if (balance < music.price) {
        alert('НЕДОСТАТОЧНО СРЕДСТВ! НУЖНО ' + music.price.toLocaleString() + ' РУБ, У ВАС ' + balance.toLocaleString() + ' РУБ');
        return;
      }
      
      if (!confirm('КУПИТЬ "' + music.name + '" ЗА ' + music.price.toLocaleString() + ' РУБ?')) return;
      
      accountsCache[currentUser].balance = balance - music.price;
      if (!accountsCache[currentUser].ownedMusic) accountsCache[currentUser].ownedMusic = [];
      accountsCache[currentUser].ownedMusic.push(music.id);
      await saveAcc();
      renderMusicList();
      alert('МУЗЫКА КУПЛЕНА!');
    };

    window.selectMusic = function(id) {
      var music = musicList.find(function(m) { return m.id === id; });
      if (!music) return;
      localStorage.setItem('set_music_' + currentUser, music.url);
      var a = document.getElementById('bg-music');
      if (music.url === 'none') {
        a.pause();
        a.src = '';
      } else {
        a.src = music.url;
        a.volume = (parseInt(localStorage.getItem('set_volume_' + currentUser)) || 50) / 100;
        a.play().catch(function() {});
      }
      renderMusicList();
    };

    function changeVolume(val) {
      document.getElementById('volume-value').textContent = val + '%';
      localStorage.setItem('set_volume_' + currentUser, val);
      var a = document.getElementById('bg-music');
      a.volume = val / 100;
    }

    function saveCheckbox(name, value) {
      localStorage.setItem('set_' + name + '_' + currentUser, value);
    }

    (async function() {
      await loadAcc();
      if (!accountsCache[currentUser]) { window.location.href = 'index.html'; return; }
      renderMusicList();
      var volume = localStorage.getItem('set_volume_' + currentUser);
      if (volume) {
        document.getElementById('volume-slider').value = volume;
        document.getElementById('volume-value').textContent = volume + '%';
      }
      var sound = localStorage.getItem('set_sound_' + currentUser);
      if (sound !== null) document.getElementById('sound-toggle').checked = sound === 'true';
      var notify = localStorage.getItem('set_notify_' + currentUser);
      if (notify !== null) document.getElementById('notify-toggle').checked = notify === 'true';
      var stats = localStorage.getItem('set_stats_' + currentUser);
      if (stats !== null) document.getElementById('stats-toggle').checked = stats === 'true';
    })();
  </script>
</body>
        </html>
