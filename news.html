<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Новости</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    @font-face {
      font-family: 'PixelFont';
      src: url('pixel-font.ttf') format('truetype');
      font-display: swap;
    }
    :root {
      --bg: #0a0a0a;
      --panel: #1a1a1a;
      --panel-light: #2a2a2a;
      --text: #ffffff;
      --text-dim: #888888;
      --border: #e0e0e0;
      --border-dim: #444444;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'PixelFont', 'Courier New', monospace;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background: var(--panel);
      padding: 24px;
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    h1 {
      font-weight: 400;
      text-align: center;
      font-size: 20px;
      color: var(--text);
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 var(--border-dim);
    }
    .news-item {
      padding: 16px 0;
      border-bottom: 3px solid var(--border-dim);
    }
    .news-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .news-title {
      font-size: 14px;
      font-weight: 400;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text);
    }
    .news-text {
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.6;
      text-transform: uppercase;
      white-space: pre-wrap;
    }
    .news-date {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .back-btn {
      display: block;
      text-align: center;
      margin-top: 24px;
      background: var(--panel-light);
      color: var(--text);
      padding: 14px;
      border: 3px solid var(--border);
      text-decoration: none;
      font-weight: 400;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .back-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .loading {
      text-align: center;
      padding: 24px;
      color: var(--text-dim);
      font-size: 12px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <audio id="bg-music" loop style="display:none;"></audio>
  <script>
  (function(){
    var u=localStorage.getItem('currentUser');
    if(!u)return;
    var d=localStorage.getItem('set_music_'+u);
    var v=parseInt(localStorage.getItem('set_volume_'+u))||50;
    var on=localStorage.getItem('set_music_on_'+u)!=='false';
    var a=document.getElementById('bg-music');
    var started=false;
    function startMusic(){
      if(started)return;
      if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
      started=true;
    }
    document.addEventListener('click',startMusic,{once:true});
    document.addEventListener('touchstart',startMusic,{once:true});
    if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
  })();
  </script>
  <div class="container">
    <h1>НОВОСТИ</h1>
    <div id="news-container"><div class="loading">ЗАГРУЗКА...</div></div>
    <a href="index.html" class="back-btn">&lt;&lt; НА ГЛАВНУЮ</a>
  </div>
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyBKfDdHsbTzZjfc4hHX3SJV563UbVBvqPQ",
      authDomain: "lucky-finger-b8b05.firebaseapp.com",
      databaseURL: "https://lucky-finger-b8b05-default-rtdb.firebaseio.com",
      projectId: "lucky-finger-b8b05",
      storageBucket: "lucky-finger-b8b05.firebasestorage.app",
      messagingSenderId: "843623003093",
      appId: "1:843623003093:web:05acfb8aa828e6cc2e835c"
    };
    firebase.initializeApp(firebaseConfig);
    var database = firebase.database();
    var currentUser = localStorage.getItem('currentUser');

    async function loadNews() {
      try {
        var snapshot = await database.ref('news').get();
        var news = snapshot.val() || {};
        var container = document.getElementById('news-container');
        
        var keys = Object.keys(news).reverse();
        
        if (keys.length === 0) {
          container.innerHTML = '<div class="loading">НОВОСТЕЙ ПОКА НЕТ</div>';
          return;
        }
        
        container.innerHTML = keys.map(function(key) {
          var n = news[key];
          var date = n.date ? new Date(n.date).toLocaleDateString('ru-RU') : '';
          var time = n.date ? new Date(n.date).toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'}) : '';
          return '<div class="news-item">' +
            '<div class="news-title">' + n.title + '</div>' +
            '<div class="news-text">' + n.text + '</div>' +
            '<div class="news-date">' + date + ' ' + time + '</div>' +
            '</div>';
        }).join('');
        
        if (currentUser && keys.length > 0) {
          localStorage.setItem('last_news_read_' + currentUser, keys[0]);
        }
      } catch(e) {
        document.getElementById('news-container').innerHTML = '<div class="loading">ОШИБКА ЗАГРУЗКИ</div>';
      }
    }

    loadNews();
  </script>
</body>
</html>
