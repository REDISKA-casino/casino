<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Управление новостями</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    @font-face {
      font-family: 'PixelFont';
      src: url('pixel-font.ttf') format('truetype');
      font-display: swap;
    }
    :root {
      --bg: #0a0a0a;
      --panel: #1a1a1a;
      --panel-light: #2a2a2a;
      --text: #ffffff;
      --text-dim: #888888;
      --border: #e0e0e0;
      --border-dim: #444444;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'PixelFont', 'Courier New', monospace;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background: var(--panel);
      padding: 24px;
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    h1 {
      font-weight: 400;
      text-align: center;
      font-size: 18px;
      color: var(--text);
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 var(--border-dim);
    }
    .input-field {
      width: 100%;
      padding: 12px;
      border: 3px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 16px;
      outline: none;
    }
    .input-field::placeholder { color: var(--text-dim); }
    .input-field:focus { border-color: var(--text); }
    .textarea-field {
      width: 100%;
      padding: 12px;
      border: 3px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      margin-bottom: 16px;
      min-height: 120px;
      resize: vertical;
      outline: none;
      line-height: 1.5;
    }
    .textarea-field::placeholder { color: var(--text-dim); }
    .textarea-field:focus { border-color: var(--text); }
    .btn-add {
      width: 100%;
      padding: 14px;
      border: 3px solid var(--border);
      font-size: 14px;
      cursor: pointer;
      font-weight: 400;
      color: var(--bg);
      background: var(--border);
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 4px 4px 0 var(--border-dim);
      margin-bottom: 20px;
    }
    .btn-add:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .back-btn {
      display: block;
      text-align: center;
      background: var(--panel-light);
      color: var(--text);
      padding: 14px;
      border: 3px solid var(--border);
      text-decoration: none;
      font-weight: 400;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .back-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ДОБАВИТЬ НОВОСТЬ</h1>
    <input type="text" class="input-field" id="news-title" placeholder="ЗАГОЛОВОК НОВОСТИ">
    <textarea class="textarea-field" id="news-text" placeholder="ТЕКСТ НОВОСТИ"></textarea>
    <button class="btn-add" onclick="addNews()">ОПУБЛИКОВАТЬ</button>
    <a href="admin.html" class="back-btn">&lt;&lt; НАЗАД В АДМИН-ПАНЕЛЬ</a>
  </div>
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyBKfDdHsbTzZjfc4hHX3SJV563UbVBvqPQ",
      authDomain: "lucky-finger-b8b05.firebaseapp.com",
      databaseURL: "https://lucky-finger-b8b05-default-rtdb.firebaseio.com",
      projectId: "lucky-finger-b8b05",
      storageBucket: "lucky-finger-b8b05.firebasestorage.app",
      messagingSenderId: "843623003093",
      appId: "1:843623003093:web:05acfb8aa828e6cc2e835c"
    };
    firebase.initializeApp(firebaseConfig);
    var database = firebase.database();

    function addNews() {
      var title = document.getElementById('news-title').value.trim();
      var text = document.getElementById('news-text').value.trim();
      
      if (!title || !text) {
        alert('ЗАПОЛНИТЕ ВСЕ ПОЛЯ');
        return;
      }
      
      var newsRef = database.ref('news').push();
      newsRef.set({
        title: title,
        text: text,
        date: new Date().toISOString()
      }).then(function() {
        alert('НОВОСТЬ ОПУБЛИКОВАНА');
        document.getElementById('news-title').value = '';
        document.getElementById('news-text').value = '';
      }).catch(function() {
        alert('ОШИБКА ПРИ ПУБЛИКАЦИИ');
      });
    }
  </script>
</body>
  </html>
