<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Обвал</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    @font-face {
      font-family: 'PixelFont';
      src: url('pixel-font.ttf') format('truetype');
      font-display: swap;
    }
    :root {
      --bg: #0a0a0a;
      --panel: #1a1a1a;
      --panel-light: #2a2a2a;
      --text: #ffffff;
      --text-dim: #888888;
      --border: #e0e0e0;
      --border-dim: #444444;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'PixelFont', 'Courier New', monospace;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }
    .header {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      padding: 16px 16px 0 16px;
    }
    .back-btn {
      background: var(--panel-light);
      color: var(--text);
      border: 3px solid var(--border);
      padding: 10px 16px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 3px 3px 0 var(--border-dim);
    }
    .back-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border-dim);
    }
    h1 {
      margin: 16px 0;
      font-weight: 400;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 var(--border-dim);
      text-align: center;
    }
    .game-container {
      width: 100%;
      max-width: 500px;
      padding: 16px;
    }
    .controls-box {
      background: var(--panel);
      padding: 20px;
      border: 3px solid var(--border);
      text-align: center;
      margin-top: 16px;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .balance-box {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      margin-bottom: 12px;
      font-size: 14px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--border-dim);
    }
    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 3px solid var(--border);
      background: var(--bg);
      color: var(--text);
      text-align: right;
      font-size: 16px;
      font-family: inherit;
      margin-top: 8px;
      margin-bottom: 16px;
      outline: none;
    }
    input[type="number"]:focus {
      border-color: var(--text);
    }
    button {
      width: 100%;
      padding: 14px;
      border: 3px solid var(--border);
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    button:disabled {
      opacity: 0.5;
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .btn-bet {
      background: var(--border);
      color: var(--bg);
      margin-top: 12px;
    }
    .btn-cashout {
      background: var(--panel-light);
      color: var(--text);
      display: none;
      margin-top: 12px;
    }
    .graph-wrapper {
      position: relative;
      width: 100%;
      height: 240px;
      overflow: hidden;
      background: var(--bg);
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    canvas {
      display: block;
    }
    .status-text {
      text-align: center;
      font-size: 14px;
      margin-bottom: 16px;
      min-height: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text);
    }
    .history-box {
      background: var(--panel);
      padding: 16px;
      font-size: 11px;
      max-height: 150px;
      overflow-y: auto;
      color: var(--text-dim);
      margin-top: 16px;
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border-dim);
      text-transform: uppercase;
    }
    .history-box::-webkit-scrollbar {
      width: 8px;
    }
    .history-box::-webkit-scrollbar-track {
      background: var(--bg);
    }
    .history-box::-webkit-scrollbar-thumb {
      background: var(--border-dim);
    }
    .label-text {
      display: block;
      text-align: left;
      font-size: 12px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <audio id="bg-music" loop style="display:none;"></audio>
  <script>
  (function(){
    var u=localStorage.getItem('currentUser');
    if(!u)return;
    var d=localStorage.getItem('set_music_'+u);
    var v=parseInt(localStorage.getItem('set_volume_'+u))||50;
    var on=localStorage.getItem('set_music_on_'+u)!=='false';
    var a=document.getElementById('bg-music');
    var started=false;
    function startMusic(){
      if(started)return;
      if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
      started=true;
    }
    document.addEventListener('click',startMusic,{once:true});
    document.addEventListener('touchstart',startMusic,{once:true});
    if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
  })();
  </script>
  <div class="header"><a href="index.html" class="back-btn" onclick="localStorage.setItem('coming_back','true')">&lt;&lt; НАЗАД</a></div>
  <div class="game-container">
    <h1>ОБВАЛ</h1>
    <div class="status-text" id="status-text">ГОТОВ К ИГРЕ</div>
    <div class="graph-wrapper" id="graph-wrapper"><canvas id="graph"></canvas></div>
    <div class="controls-box">
      <div class="balance-box"><span>БАЛАНС</span><span id="balance-display">1000 РУБ</span></div>
      <span class="label-text">СТАВКА</span>
      <input type="number" id="bet-input" min="1" value="100" />
      <button class="btn-bet" id="btn-start">СДЕЛАТЬ СТАВКУ</button>
      <button class="btn-cashout" id="btn-cashout">ВЫВЕСТИ</button>
    </div>
    <div class="history-box" id="history-box">ИСТОРИЯ РАУНДОВ</div>
  </div>
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyBKfDdHsbTzZjfc4hHX3SJV563UbVBvqPQ",
      authDomain: "lucky-finger-b8b05.firebaseapp.com",
      databaseURL: "https://lucky-finger-b8b05-default-rtdb.firebaseio.com",
      projectId: "lucky-finger-b8b05",
      storageBucket: "lucky-finger-b8b05.firebasestorage.app",
      messagingSenderId: "843623003093",
      appId: "1:843623003093:web:05acfb8aa828e6cc2e835c"
    };
    firebase.initializeApp(firebaseConfig);
    var database = firebase.database();
    var accountsCache = {};
    var currentUser = localStorage.getItem('currentUser');
    if (!currentUser) { window.location.href = 'index.html'; }
    var balance = parseInt(localStorage.getItem('bal_' + currentUser)) || 1000;
    var bet = 0, isPlaying = false, crashMultiplier = 0, currentMultiplier = 1, animationFrameId;
    var MAX_CRASH = 10, SPEED_MULTIPLIER = 0.010;

    async function loadAcc() { try { var snapshot = await database.ref('accounts').get(); accountsCache = snapshot.val() || {}; } catch(e) {} }
    async function saveAcc() { try { await database.ref('accounts').set(accountsCache); } catch(e) {} }
    function saveBal() { localStorage.setItem('bal_' + currentUser, balance); document.getElementById('balance-display').textContent = balance.toLocaleString() + ' РУБ'; syncNow(); }
    async function syncNow() { if (accountsCache[currentUser]) { accountsCache[currentUser].balance = balance; await saveAcc(); } }
    function addHistory(text) { var box = document.getElementById('history-box'); if(!box) return; var div = document.createElement('div'); div.textContent = text; div.style.padding = '6px 0'; div.style.borderBottom = '2px solid var(--border-dim)'; box.insertBefore(div, box.firstChild); while(box.children.length > 20) { box.removeChild(box.lastChild); } }
    document.getElementById('balance-display').textContent = balance.toLocaleString() + ' РУБ';

    function resize() { var c = document.getElementById('graph'), w = document.getElementById('graph-wrapper').clientWidth, h = document.getElementById('graph-wrapper').clientHeight, dpr = window.devicePixelRatio || 1; c.width = w * dpr; c.height = h * dpr; c.style.width = w + 'px'; c.style.height = h + 'px'; c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0); }
    window.addEventListener('resize', resize); resize();

    document.getElementById('btn-start').onclick = function() { if(isPlaying) return; bet = +document.getElementById('bet-input').value; if(!bet || bet <= 0 || bet > balance) { alert('НЕКОРРЕКТНАЯ СТАВКА'); return; } startRound(); };
    document.getElementById('btn-cashout').onclick = function() { if(isPlaying) endRound(true); };

    function startRound() { isPlaying = true; document.getElementById('bet-input').disabled = true; document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-cashout').style.display = 'block'; document.getElementById('status-text').textContent = 'ИГРА ИДЁТ...'; document.getElementById('status-text').style.color = 'var(--text)'; balance -= bet; saveBal(); crashMultiplier = 1 + 9 * Math.pow(Math.random(), 3); currentMultiplier = 1; drawGraph(); }

    function drawGraph() {
      var c = document.getElementById('graph'), ctx = c.getContext('2d'), w = document.getElementById('graph-wrapper').clientWidth, h = c.height / (window.devicePixelRatio || 1);
      ctx.clearRect(0, 0, w, h); var vM = 20, uH = h - vM * 2, sX = w / MAX_CRASH, sY = uH / MAX_CRASH;
      ctx.strokeStyle = '#444444'; ctx.lineWidth = 1;
      for(var m = 0; m <= MAX_CRASH; m++) { ctx.beginPath(); ctx.moveTo(m * sX, 0); ctx.lineTo(m * sX, h); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, h - m * sY - vM); ctx.lineTo(w, h - m * sY - vM); ctx.stroke(); }
      ctx.fillStyle = '#888888'; ctx.font = '10px PixelFont, monospace'; ctx.textAlign = 'right';
      for(var m = 1; m <= MAX_CRASH; m++) ctx.fillText(m.toFixed(1), 16, h - m * sY - vM + 4);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, h - vM);
      function animate() { if(!isPlaying) return; currentMultiplier += SPEED_MULTIPLIER; if(currentMultiplier >= crashMultiplier) { endRound(false); return; } ctx.lineTo(currentMultiplier * sX, h - currentMultiplier * sY - vM); ctx.stroke(); animationFrameId = requestAnimationFrame(animate); }
      animationFrameId = requestAnimationFrame(animate);
    }

    function endRound(won) { isPlaying = false; cancelAnimationFrame(animationFrameId); document.getElementById('btn-start').style.display = 'block'; document.getElementById('btn-cashout').style.display = 'none'; document.getElementById('bet-input').disabled = false;
      if(won) { var w = Math.floor(bet * currentMultiplier); balance += w; document.getElementById('status-text').textContent = 'ВЫВЕДЕНО: ' + currentMultiplier.toFixed(2) + 'X'; document.getElementById('status-text').style.color = 'var(--text)'; addHistory('ПОБЕДА: +' + w + ' РУБ (X' + currentMultiplier.toFixed(2) + ')'); }
      else { document.getElementById('status-text').textContent = 'ОБВАЛ НА ' + crashMultiplier.toFixed(2) + 'X'; document.getElementById('status-text').style.color = 'var(--text-dim)'; addHistory('ПРОИГРЫШ: -' + bet + ' РУБ'); }
      saveBal(); }

    (async function() { await loadAcc(); })();
  </script>
</body>
  </html>
