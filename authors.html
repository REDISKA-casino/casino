<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Авторы</title>
  <style>
    @font-face {
      font-family: 'PixelFont';
      src: url('pixel-font.ttf') format('truetype');
      font-display: swap;
    }
    :root {
      --bg: #0a0a0a;
      --panel: #1a1a1a;
      --panel-light: #2a2a2a;
      --text: #ffffff;
      --text-dim: #888888;
      --border: #e0e0e0;
      --border-dim: #444444;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'PixelFont', 'Courier New', monospace;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }
    .container {
      width: 100%;
      max-width: 500px;
      padding: 16px;
    }
    h1 {
      margin: 16px 0;
      font-weight: 400;
      text-align: center;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 var(--border-dim);
    }
    .back-btn {
      display: block;
      text-align: center;
      background: var(--panel-light);
      color: var(--text);
      border: 3px solid var(--border);
      padding: 14px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .back-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .authors-card {
      background: var(--panel);
      padding: 24px;
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .author-section {
      margin-bottom: 24px;
    }
    .author-title {
      font-size: 14px;
      font-weight: 400;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .author-name {
      font-size: 16px;
      color: var(--text);
      font-weight: 400;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 var(--border-dim);
    }
    .music-authors {
      color: var(--text-dim);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .thanks-section {
      margin-top: 24px;
    }
    .thanks-link {
      display: block;
      padding: 14px;
      text-decoration: none;
      color: var(--text);
      font-weight: 400;
      margin-bottom: 12px;
      text-align: center;
      border: 3px solid var(--border);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 12px;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .thanks-link:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .github-link {
      background: var(--panel-light);
    }
    .firebase-link {
      background: var(--bg);
    }
    .author-label {
      color: var(--text-dim);
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>АВТОРЫ</h1>
    <a href="index.html" class="back-btn">&lt;&lt; НАЗАД</a>
    <div class="authors-card">
      <div class="author-section">
        <div class="author-title"><span class="author-label">АВТОР:</span></div>
        <div class="author-name">REDISKA</div>
      </div>
      <div class="author-section">
        <div class="author-title"><span class="author-label">МУЗЫКА:</span></div>
        <div class="music-authors">АВТОРЫ МУЗЫКИ (ЗАБЫЛ)</div>
      </div>
      <div class="author-section">
        <div class="author-title"><span class="author-label">БЛАГОДАРНОСТЬ:</span></div>
      </div>
      <div class="thanks-section">
        <a href="https://github.com" target="_blank" class="thanks-link github-link">GITHUB</a>
        <a href="https://firebase.google.com" target="_blank" class="thanks-link firebase-link">FIREBASE</a>
      </div>
    </div>
  </div>
</body>
</html>
