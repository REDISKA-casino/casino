<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Лидерборд</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    @font-face {
      font-family: 'PixelFont';
      src: url('pixel-font.ttf') format('truetype');
      font-display: swap;
    }
    :root {
      --bg: #0a0a0a;
      --panel: #1a1a1a;
      --panel-light: #2a2a2a;
      --text: #ffffff;
      --text-dim: #888888;
      --border: #e0e0e0;
      --border-dim: #444444;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'PixelFont', 'Courier New', monospace;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background: var(--panel);
      padding: 24px;
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    h1 {
      font-weight: 400;
      text-align: center;
      font-size: 20px;
      color: var(--text);
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 var(--border-dim);
    }
    .player-row {
      display: flex;
      align-items: center;
      padding: 12px 8px;
      border-bottom: 2px solid var(--border-dim);
      gap: 12px;
    }
    .player-row:last-child {
      border-bottom: none;
    }
    .player-rank {
      font-size: 14px;
      font-weight: 400;
      width: 40px;
      text-align: center;
      color: var(--text-dim);
    }
    .player-rank.top {
      color: var(--text);
      text-shadow: 1px 1px 0 var(--border-dim);
    }
    .player-name {
      flex: 1;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .player-name.you {
      color: var(--text);
      font-weight: 400;
      text-shadow: 2px 2px 0 var(--border-dim);
    }
    .player-balance {
      font-weight: 400;
      color: var(--text);
      font-size: 12px;
      letter-spacing: 1px;
    }
    .back-btn {
      display: block;
      text-align: center;
      margin-top: 24px;
      background: var(--panel-light);
      color: var(--text);
      padding: 14px;
      border: 3px solid var(--border);
      text-decoration: none;
      font-weight: 400;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .back-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .loading {
      text-align: center;
      padding: 24px;
      color: var(--text-dim);
      font-size: 12px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <audio id="bg-music" loop style="display:none;"></audio>
  <script>
  (function(){
    var u=localStorage.getItem('currentUser');
    if(!u)return;
    var d=localStorage.getItem('set_music_'+u);
    var v=parseInt(localStorage.getItem('set_volume_'+u))||50;
    var on=localStorage.getItem('set_music_on_'+u)!=='false';
    var a=document.getElementById('bg-music');
    var started=false;
    function startMusic(){
      if(started)return;
      if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
      started=true;
    }
    document.addEventListener('click',startMusic,{once:true});
    document.addEventListener('touchstart',startMusic,{once:true});
    if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
  })();
  </script>
  <div class="container">
    <h1>ЛИДЕРБОРД</h1>
    <div id="leaderboard-container"><div class="loading">ЗАГРУЗКА...</div></div>
    <a href="index.html" class="back-btn">&lt;&lt; НА ГЛАВНУЮ</a>
  </div>
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyBKfDdHsbTzZjfc4hHX3SJV563UbVBvqPQ",
      authDomain: "lucky-finger-b8b05.firebaseapp.com",
      databaseURL: "https://lucky-finger-b8b05-default-rtdb.firebaseio.com",
      projectId: "lucky-finger-b8b05",
      storageBucket: "lucky-finger-b8b05.firebasestorage.app",
      messagingSenderId: "843623003093",
      appId: "1:843623003093:web:05acfb8aa828e6cc2e835c"
    };
    firebase.initializeApp(firebaseConfig);
    var database = firebase.database();
    var currentUser = localStorage.getItem('currentUser');
    var ADMIN_NICKNAME = 'I-am-admin';

    async function loadLeaderboard() {
      try {
        var snapshot = await database.ref('accounts').get();
        var accounts = snapshot.val() || {};
        
        var players = [];
        for (var nickname in accounts) {
          if (nickname !== ADMIN_NICKNAME) {
            players.push({ name: nickname, balance: accounts[nickname].balance || 0 });
          }
        }
        
        players.sort(function(a, b) { return b.balance - a.balance; });
        
        var container = document.getElementById('leaderboard-container');
        
        if (players.length === 0) {
          container.innerHTML = '<div class="loading">НЕТ ИГРОКОВ</div>';
          return;
        }
        
        container.innerHTML = players.map(function(p, i) {
          var rank = i + 1;
          var rankClass = rank <= 3 ? 'top' : '';
          var rankText = rank === 1 ? '[1]' : rank === 2 ? '[2]' : rank === 3 ? '[3]' : '#' + rank;
          
          var isYou = currentUser && p.name === currentUser;
          var nameClass = isYou ? 'you' : '';
          
          return '<div class="player-row">' +
            '<div class="player-rank ' + rankClass + '">' + rankText + '</div>' +
            '<div class="player-name ' + nameClass + '">' + p.name + (isYou ? ' (ВЫ)' : '') + '</div>' +
            '<div class="player-balance">' + p.balance.toLocaleString() + ' РУБ</div>' +
            '</div>';
        }).join('');
      } catch(e) {
        document.getElementById('leaderboard-container').innerHTML = '<div class="loading">ОШИБКА ЗАГРУЗКИ</div>';
      }
    }

    loadLeaderboard();
  </script>
</body>
  </html>
