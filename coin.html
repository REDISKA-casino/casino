<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Орёл и Решка</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    @font-face {
      font-family: 'PixelFont';
      src: url('pixel-font.ttf') format('truetype');
      font-display: swap;
    }
    :root {
      --bg: #0a0a0a;
      --panel: #1a1a1a;
      --panel-light: #2a2a2a;
      --text: #ffffff;
      --text-dim: #888888;
      --border: #e0e0e0;
      --border-dim: #444444;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'PixelFont', 'Courier New', monospace;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }
    .header {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      padding: 16px 16px 0 16px;
    }
    .back-btn {
      background: var(--panel-light);
      color: var(--text);
      border: 3px solid var(--border);
      padding: 10px 16px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 3px 3px 0 var(--border-dim);
    }
    .back-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border-dim);
    }
    h1 {
      margin: 16px 0;
      font-weight: 400;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 var(--border-dim);
      text-align: center;
    }
    .game-container {
      width: 100%;
      max-width: 500px;
      padding: 16px;
    }
    .coin-area {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 30px 0;
      height: 160px;
      perspective: 600px;
    }
    .coin {
      width: 120px;
      height: 120px;
      position: relative;
      transform-style: preserve-3d;
      transition: none;
    }
    .coin.flipping {
      animation: flip 1.5s ease-out;
    }
    @keyframes flip {
      0% { transform: rotateY(0); }
      20% { transform: rotateY(360deg) scale(1.2); }
      40% { transform: rotateY(720deg) scale(1.1); }
      60% { transform: rotateY(1080deg) scale(1.05); }
      80% { transform: rotateY(1440deg) scale(1); }
      100% { transform: rotateY(1800deg) scale(1); }
    }
    .coin-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
      font-weight: 400;
      backface-visibility: hidden;
      border: 4px solid var(--border);
      background: var(--bg);
      color: var(--text);
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .coin-back {
      transform: rotateY(180deg);
      background: var(--panel-light);
    }
    .controls-box {
      background: var(--panel);
      padding: 20px;
      border: 3px solid var(--border);
      text-align: center;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .balance-box {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      margin-bottom: 12px;
      font-size: 14px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--border-dim);
    }
    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 3px solid var(--border);
      background: var(--bg);
      color: var(--text);
      text-align: center;
      font-size: 16px;
      font-family: inherit;
      margin-bottom: 16px;
      outline: none;
    }
    input[type="number"]:focus {
      border-color: var(--text);
    }
    .choice-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .choice-btn {
      padding: 16px 8px;
      border: 3px solid var(--border);
      font-size: 12px;
      font-weight: 400;
      cursor: pointer;
      color: var(--text);
      background: var(--panel-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 3px 3px 0 var(--border-dim);
    }
    .choice-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border-dim);
    }
    .choice-btn:disabled {
      opacity: 0.5;
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border-dim);
    }
    .choice-btn.selected {
      border-color: var(--text);
      background: var(--border);
      color: var(--bg);
      box-shadow: 2px 2px 0 var(--border-dim);
      transform: translate(2px, 2px);
    }
    .btn-flip {
      width: 100%;
      padding: 14px;
      border: 3px solid var(--border);
      font-size: 14px;
      cursor: pointer;
      font-weight: 400;
      color: var(--bg);
      background: var(--border);
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .btn-flip:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .btn-flip:disabled {
      opacity: 0.5;
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .status-text {
      text-align: center;
      font-size: 14px;
      margin-bottom: 16px;
      min-height: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text);
    }
    .history-box {
      background: var(--panel);
      padding: 16px;
      font-size: 11px;
      max-height: 120px;
      overflow-y: auto;
      color: var(--text-dim);
      margin-top: 16px;
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border-dim);
      text-transform: uppercase;
    }
    .history-box::-webkit-scrollbar {
      width: 8px;
    }
    .history-box::-webkit-scrollbar-track {
      background: var(--bg);
    }
    .history-box::-webkit-scrollbar-thumb {
      background: var(--border-dim);
    }
  </style>
</head>
<body>
  <audio id="bg-music" loop style="display:none;"></audio>
  <script>
  (function(){
    var u=localStorage.getItem('currentUser');
    if(!u)return;
    var d=localStorage.getItem('set_music_'+u);
    var v=parseInt(localStorage.getItem('set_volume_'+u))||50;
    var on=localStorage.getItem('set_music_on_'+u)!=='false';
    var a=document.getElementById('bg-music');
    var started=false;
    function startMusic(){
      if(started)return;
      if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
      started=true;
    }
    document.addEventListener('click',startMusic,{once:true});
    document.addEventListener('touchstart',startMusic,{once:true});
    if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
  })();
  </script>
  <div class="header"><a href="index.html" class="back-btn" onclick="localStorage.setItem('coming_back','true')">&lt;&lt; НАЗАД</a></div>
  <div class="game-container">
    <h1>ОРЁЛ И РЕШКА</h1>
    <div class="status-text" id="status-text">ВЫБЕРИТЕ СТОРОНУ И ПОДБРОСЬТЕ МОНЕТУ</div>
    <div class="coin-area">
      <div class="coin" id="coin">
        <div class="coin-face coin-front">[O]</div>
        <div class="coin-face coin-back">[R]</div>
      </div>
    </div>
    <div class="controls-box">
      <div class="balance-box"><span>БАЛАНС</span><span id="balance-display">1000 РУБ</span></div>
      <input type="number" id="bet-input" min="1" value="100" placeholder="СТАВКА" />
      <div class="choice-buttons">
        <button class="choice-btn" id="btn-eagle">[O] ОРЁЛ<br>X2</button>
        <button class="choice-btn" id="btn-tail">[R] РЕШКА<br>X2</button>
      </div>
      <button class="btn-flip" id="btn-flip">ПОДБРОСИТЬ</button>
    </div>
    <div class="history-box" id="history-box">ИСТОРИЯ БРОСКОВ</div>
  </div>
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyBKfDdHsbTzZjfc4hHX3SJV563UbVBvqPQ",
      authDomain: "lucky-finger-b8b05.firebaseapp.com",
      databaseURL: "https://lucky-finger-b8b05-default-rtdb.firebaseio.com",
      projectId: "lucky-finger-b8b05",
      storageBucket: "lucky-finger-b8b05.firebasestorage.app",
      messagingSenderId: "843623003093",
      appId: "1:843623003093:web:05acfb8aa828e6cc2e835c"
    };
    firebase.initializeApp(firebaseConfig);
    var database = firebase.database();
    var accountsCache = {};
    var currentUser = localStorage.getItem('currentUser');
    if (!currentUser) window.location.href = 'index.html';
    var balance = parseInt(localStorage.getItem('bal_' + currentUser)) || 1000;
    var selectedChoice = null, isFlipping = false;

    async function loadAcc() { try { var snapshot = await database.ref('accounts').get(); accountsCache = snapshot.val() || {}; } catch(e) {} }
    async function saveAcc() { try { await database.ref('accounts').set(accountsCache); } catch(e) {} }
    function saveBal() { localStorage.setItem('bal_' + currentUser, balance); document.getElementById('balance-display').textContent = balance.toLocaleString() + ' РУБ'; syncNow(); }
    async function syncNow() { if (accountsCache[currentUser]) { accountsCache[currentUser].balance = balance; await saveAcc(); } }
    function addHistory(text) { var box = document.getElementById('history-box'); if(!box) return; var div = document.createElement('div'); div.textContent = text; div.style.padding = '4px 0'; div.style.borderBottom = '2px solid var(--border-dim)'; box.insertBefore(div, box.firstChild); while(box.children.length > 20) { box.removeChild(box.lastChild); } }
    document.getElementById('balance-display').textContent = balance.toLocaleString() + ' РУБ';

    document.getElementById('btn-eagle').onclick = function() { if(isFlipping) return; selectedChoice = 'eagle'; this.classList.add('selected'); document.getElementById('btn-tail').classList.remove('selected'); };
    document.getElementById('btn-tail').onclick = function() { if(isFlipping) return; selectedChoice = 'tail'; this.classList.add('selected'); document.getElementById('btn-eagle').classList.remove('selected'); };

    document.getElementById('btn-flip').onclick = function() {
      if(isFlipping || !selectedChoice) return;
      var bet = +document.getElementById('bet-input').value;
      if(!bet || bet <= 0 || bet > balance) { alert('НЕКОРРЕКТНАЯ СТАВКА'); return; }
      isFlipping = true;
      document.getElementById('btn-flip').disabled = true;
      document.getElementById('btn-eagle').disabled = true;
      document.getElementById('btn-tail').disabled = true;
      balance -= bet; saveBal();
      var coin = document.getElementById('coin');
      var rand = Math.random() * 100;
      var result = rand < 1 ? 'edge' : (rand < 50.5 ? 'eagle' : 'tail');
      coin.classList.add('flipping');
      document.getElementById('status-text').textContent = 'МОНЕТКА ЛЕТИТ...';
      document.getElementById('status-text').style.color = 'var(--text)';
      setTimeout(function() {
        coin.classList.remove('flipping');
        var won = false, win = 0, displayText = '';
        if(result === 'edge') { won = true; win = bet * 50; displayText = 'РЕБРО!'; }
        else if(result === selectedChoice) { won = true; win = bet * 2; displayText = result === 'eagle' ? 'ОРЁЛ!' : 'РЕШКА!'; }
        else { displayText = result === 'eagle' ? 'ОРЁЛ!' : 'РЕШКА!'; }
        balance += win; saveBal();
        document.getElementById('status-text').textContent = displayText + ' ' + (won ? '+' + win + ' РУБ' : '-' + bet + ' РУБ');
        document.getElementById('status-text').style.color = won ? 'var(--text)' : 'var(--text-dim)';
        addHistory(displayText + ': ' + (won ? '+' + win + ' РУБ' : '-' + bet + ' РУБ'));
        isFlipping = false;
        document.getElementById('btn-flip').disabled = false;
        document.getElementById('btn-eagle').disabled = false;
        document.getElementById('btn-tail').disabled = false;
        document.getElementById('btn-eagle').classList.remove('selected');
        document.getElementById('btn-tail').classList.remove('selected');
        selectedChoice = null;
      }, 1600);
    };

    (async function() { await loadAcc(); })();
  </script>
</body>
      </html>
