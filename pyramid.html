<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Пирамида</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    @font-face {
      font-family: 'PixelFont';
      src: url('pixel-font.ttf') format('truetype');
      font-display: swap;
    }
    :root {
      --bg: #0a0a0a;
      --panel: #1a1a1a;
      --panel-light: #2a2a2a;
      --text: #ffffff;
      --text-dim: #888888;
      --border: #e0e0e0;
      --border-dim: #444444;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'PixelFont', 'Courier New', monospace;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }
    .header {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      padding: 16px 16px 0 16px;
    }
    .back-btn {
      background: var(--panel-light);
      color: var(--text);
      border: 3px solid var(--border);
      padding: 10px 16px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 3px 3px 0 var(--border-dim);
    }
    .back-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border-dim);
    }
    h1 {
      margin: 16px 0;
      font-weight: 400;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 var(--border-dim);
      text-align: center;
    }
    .game-container {
      width: 100%;
      max-width: 500px;
      padding: 16px;
    }
    .cups-area {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 30px 0;
    }
    .cup {
      width: 80px;
      height: 100px;
      background: var(--panel);
      border: 3px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      transition: transform 0.1s;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .cup:hover {
      transform: translateY(-5px);
    }
    .cup.revealed {
      transform: translateY(-10px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .cup.winner {
      background: var(--border);
      color: var(--bg);
    }
    .shuffling .cup {
      animation: shake 0.2s infinite;
    }
    @keyframes shake {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 2px); }
      50% { transform: translate(2px, -2px); }
      75% { transform: translate(-2px, -2px); }
      100% { transform: translate(0, 0); }
    }
    .controls-box {
      background: var(--panel);
      padding: 20px;
      border: 3px solid var(--border);
      text-align: center;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .balance-box {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      margin-bottom: 12px;
      font-size: 14px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--border-dim);
    }
    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 3px solid var(--border);
      background: var(--bg);
      color: var(--text);
      text-align: center;
      font-size: 16px;
      font-family: inherit;
      margin-bottom: 16px;
      outline: none;
    }
    input[type="number"]:focus {
      border-color: var(--text);
    }
    .btn-play {
      width: 100%;
      padding: 14px;
      border: 3px solid var(--border);
      font-size: 14px;
      cursor: pointer;
      font-weight: 400;
      color: var(--bg);
      background: var(--border);
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .btn-play:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .btn-play:disabled {
      opacity: 0.5;
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .status-text {
      text-align: center;
      font-size: 14px;
      margin-bottom: 16px;
      min-height: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text);
    }
    .shuffling-text {
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
      margin: 16px 0;
      min-height: 20px;
      text-transform: uppercase;
    }
    .history-box {
      background: var(--panel);
      padding: 16px;
      font-size: 11px;
      max-height: 120px;
      overflow-y: auto;
      color: var(--text-dim);
      margin-top: 16px;
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border-dim);
      text-transform: uppercase;
    }
    .history-box::-webkit-scrollbar {
      width: 8px;
    }
    .history-box::-webkit-scrollbar-track {
      background: var(--bg);
    }
    .history-box::-webkit-scrollbar-thumb {
      background: var(--border-dim);
    }
  </style>
</head>
<body>
  <audio id="bg-music" loop style="display:none;"></audio>
  <script>
  (function(){
    var u=localStorage.getItem('currentUser');
    if(!u)return;
    var d=localStorage.getItem('set_music_'+u);
    var v=parseInt(localStorage.getItem('set_volume_'+u))||50;
    var on=localStorage.getItem('set_music_on_'+u)!=='false';
    var a=document.getElementById('bg-music');
    var started=false;
    function startMusic(){
      if(started)return;
      if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
      started=true;
    }
    document.addEventListener('click',startMusic,{once:true});
    document.addEventListener('touchstart',startMusic,{once:true});
    if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
  })();
  </script>
  <div class="header"><a href="index.html" class="back-btn" onclick="localStorage.setItem('coming_back','true')">&lt;&lt; НАЗАД</a></div>
  <div class="game-container">
    <h1>ПИРАМИДА</h1>
    <div class="status-text" id="status-text">НАЙДИТЕ АЛМАЗ! X3</div>
    <div class="cups-area" id="cups-area">
      <div class="cup" data-cup="0">[ ? ]</div>
      <div class="cup" data-cup="1">[ ? ]</div>
      <div class="cup" data-cup="2">[ ? ]</div>
    </div>
    <div class="shuffling-text" id="shuffling-text"></div>
    <div class="controls-box">
      <div class="balance-box"><span>БАЛАНС</span><span id="balance-display">1000 РУБ</span></div>
      <input type="number" id="bet-input" min="1" value="100" placeholder="СТАВКА" />
      <button class="btn-play" id="btn-play">ИГРАТЬ</button>
    </div>
    <div class="history-box" id="history-box">ИСТОРИЯ ИГР</div>
  </div>
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyBKfDdHsbTzZjfc4hHX3SJV563UbVBvqPQ",
      authDomain: "lucky-finger-b8b05.firebaseapp.com",
      databaseURL: "https://lucky-finger-b8b05-default-rtdb.firebaseio.com",
      projectId: "lucky-finger-b8b05",
      storageBucket: "lucky-finger-b8b05.firebasestorage.app",
      messagingSenderId: "843623003093",
      appId: "1:843623003093:web:05acfb8aa828e6cc2e835c"
    };
    firebase.initializeApp(firebaseConfig);
    var database = firebase.database();
    var accountsCache = {};
    var currentUser = localStorage.getItem('currentUser');
    if (!currentUser) window.location.href = 'index.html';
    var balance = parseInt(localStorage.getItem('bal_' + currentUser)) || 1000;
    var isPlaying = false, prizeCup = 0, currentBet = 0;

    async function loadAcc() { try { var snapshot = await database.ref('accounts').get(); accountsCache = snapshot.val() || {}; } catch(e) {} }
    async function saveAcc() { try { await database.ref('accounts').set(accountsCache); } catch(e) {} }
    function saveBal() { localStorage.setItem('bal_' + currentUser, balance); document.getElementById('balance-display').textContent = balance.toLocaleString() + ' РУБ'; syncNow(); }
    async function syncNow() { if (accountsCache[currentUser]) { accountsCache[currentUser].balance = balance; await saveAcc(); } }
    function addHistory(text) { var box = document.getElementById('history-box'); if(!box) return; var div = document.createElement('div'); div.textContent = text; div.style.padding = '6px 0'; div.style.borderBottom = '2px solid var(--border-dim)'; box.insertBefore(div, box.firstChild); while(box.children.length > 20) { box.removeChild(box.lastChild); } }
    document.getElementById('balance-display').textContent = balance.toLocaleString() + ' РУБ';

    function reset() {
      document.getElementById('cups-area').classList.remove('shuffling');
      document.querySelectorAll('.cup').forEach(function(c) { 
        c.classList.remove('revealed', 'winner'); 
        c.textContent = '[ ? ]'; 
        c.style.pointerEvents = 'auto'; 
      });
      document.getElementById('shuffling-text').textContent = '';
    }

    document.getElementById('btn-play').onclick = function() {
      if(isPlaying) return;
      currentBet = +document.getElementById('bet-input').value;
      if(!currentBet || currentBet <= 0 || currentBet > balance) { alert('НЕКОРРЕКТНАЯ СТАВКА'); return; }
      isPlaying = true; document.getElementById('btn-play').disabled = true;
      balance -= currentBet; saveBal(); reset();
      prizeCup = Math.floor(Math.random() * 3);
      
      document.getElementById('cups-area').classList.add('shuffling');
      document.getElementById('shuffling-text').textContent = 'ПЕРЕМЕШИВАНИЕ...';
      
      var s = 0;
      var iv = setInterval(function() {
        s++;
        if(s >= 10) {
          clearInterval(iv);
          document.getElementById('cups-area').classList.remove('shuffling');
          document.querySelectorAll('.cup').forEach(function(c) {
            c.onclick = function() { if(!isPlaying) return; reveal(+this.dataset.cup); };
          });
          document.getElementById('shuffling-text').textContent = 'ВЫБЕРИТЕ ЧАШУ!';
        }
      }, 200);
    };

    function reveal(chosen) {
      isPlaying = false; document.getElementById('btn-play').disabled = false;
      document.querySelectorAll('.cup').forEach(function(c, i) {
        c.classList.add('revealed'); c.style.pointerEvents = 'none';
        c.textContent = i === prizeCup ? '[ D ]' : '[ X ]';
        if(i === prizeCup) c.classList.add('winner');
      });
      var won = chosen === prizeCup, win = won ? currentBet * 3 : 0;
      balance += win; saveBal();
      document.getElementById('status-text').textContent = won ? 'АЛМАЗ! +' + win + ' РУБ' : 'КАМЕНЬ... -' + currentBet + ' РУБ';
      document.getElementById('status-text').style.color = won ? 'var(--text)' : 'var(--text-dim)';
      document.getElementById('shuffling-text').textContent = won ? 'ПОЗДРАВЛЯЕМ!' : 'НЕ ПОВЕЗЛО';
      addHistory(won ? 'АЛМАЗ! +' + win + ' РУБ' : 'КАМЕНЬ: -' + currentBet + ' РУБ');
      setTimeout(reset, 2000);
    }

    (async function() { await loadAcc(); })();
  </script>
</body>
</html>
