<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Плинко</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    @font-face {
      font-family: 'PixelFont';
      src: url('pixel-font.ttf') format('truetype');
      font-display: swap;
    }
    :root {
      --bg: #0a0a0a;
      --panel: #1a1a1a;
      --panel-light: #2a2a2a;
      --text: #ffffff;
      --text-dim: #888888;
      --border: #e0e0e0;
      --border-dim: #444444;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'PixelFont', 'Courier New', monospace;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }
    .header {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      padding: 16px 16px 0 16px;
    }
    .back-btn {
      background: var(--panel-light);
      color: var(--text);
      border: 3px solid var(--border);
      padding: 10px 16px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 3px 3px 0 var(--border-dim);
    }
    .back-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border-dim);
    }
    h1 {
      margin: 16px 0;
      font-weight: 400;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 0 var(--border-dim);
      text-align: center;
    }
    .game-container {
      width: 100%;
      max-width: 500px;
      padding: 16px;
    }
    .board {
      position: relative;
      width: 100%;
      height: 320px;
      background: var(--bg);
      border: 3px solid var(--border);
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .peg {
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--border);
      z-index: 1;
      border-radius: 0;
    }
    .ball {
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--text);
      z-index: 2;
      display: none;
      border-radius: 0;
      box-shadow: 0 0 10px var(--border-dim);
    }
    .slot {
      position: absolute;
      bottom: 0;
      height: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 400;
      font-size: 10px;
      color: var(--text);
      z-index: 0;
      border-top: 2px solid var(--border);
      border-left: 1px solid var(--border-dim);
      text-transform: uppercase;
    }
    .controls-box {
      background: var(--panel);
      padding: 20px;
      border: 3px solid var(--border);
      text-align: center;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .balance-box {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      margin-bottom: 12px;
      font-size: 14px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--border-dim);
    }
    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 3px solid var(--border);
      background: var(--bg);
      color: var(--text);
      text-align: center;
      font-size: 16px;
      font-family: inherit;
      margin-bottom: 16px;
      outline: none;
    }
    input[type="number"]:focus {
      border-color: var(--text);
    }
    .btn-drop {
      width: 100%;
      padding: 14px;
      border: 3px solid var(--border);
      font-size: 14px;
      cursor: pointer;
      font-weight: 400;
      color: var(--bg);
      background: var(--border);
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 4px 4px 0 var(--border-dim);
    }
    .btn-drop:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .btn-drop:disabled {
      opacity: 0.5;
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--border-dim);
    }
    .status-text {
      text-align: center;
      font-size: 14px;
      margin-bottom: 16px;
      min-height: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text);
    }
    .history-box {
      background: var(--panel);
      padding: 16px;
      font-size: 11px;
      max-height: 120px;
      overflow-y: auto;
      color: var(--text-dim);
      margin-top: 16px;
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border-dim);
      text-transform: uppercase;
    }
    .history-box::-webkit-scrollbar {
      width: 8px;
    }
    .history-box::-webkit-scrollbar-track {
      background: var(--bg);
    }
    .history-box::-webkit-scrollbar-thumb {
      background: var(--border-dim);
    }
  </style>
</head>
<body>
  <audio id="bg-music" loop style="display:none;"></audio>
  <script>
  (function(){
    var u=localStorage.getItem('currentUser');
    if(!u)return;
    var d=localStorage.getItem('set_music_'+u);
    var v=parseInt(localStorage.getItem('set_volume_'+u))||50;
    var on=localStorage.getItem('set_music_on_'+u)!=='false';
    var a=document.getElementById('bg-music');
    var started=false;
    function startMusic(){
      if(started)return;
      if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
      started=true;
    }
    document.addEventListener('click',startMusic,{once:true});
    document.addEventListener('touchstart',startMusic,{once:true});
    if(d&&on&&d!=='none'){a.src=d;a.volume=v/100;a.play().catch(function(){});}
  })();
  </script>
  <div class="header"><a href="index.html" class="back-btn" onclick="localStorage.setItem('coming_back','true')">&lt;&lt; НАЗАД</a></div>
  <div class="game-container">
    <h1>ПЛИНКО</h1>
    <div class="status-text" id="status-text">СДЕЛАЙТЕ СТАВКУ И БРОСЬТЕ ШАРИК</div>
    <div class="board" id="board"><div class="ball" id="ball"></div></div>
    <div class="controls-box">
      <div class="balance-box"><span>БАЛАНС</span><span id="balance-display">1000 РУБ</span></div>
      <input type="number" id="bet-input" min="1" value="100" placeholder="СТАВКА" />
      <button class="btn-drop" id="btn-drop">БРОСИТЬ ШАРИК</button>
    </div>
    <div class="history-box" id="history-box">ИСТОРИЯ БРОСКОВ</div>
  </div>
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyBKfDdHsbTzZjfc4hHX3SJV563UbVBvqPQ",
      authDomain: "lucky-finger-b8b05.firebaseapp.com",
      databaseURL: "https://lucky-finger-b8b05-default-rtdb.firebaseio.com",
      projectId: "lucky-finger-b8b05",
      storageBucket: "lucky-finger-b8b05.firebasestorage.app",
      messagingSenderId: "843623003093",
      appId: "1:843623003093:web:05acfb8aa828e6cc2e835c"
    };
    firebase.initializeApp(firebaseConfig);
    var database = firebase.database();
    var accountsCache = {};
    var currentUser = localStorage.getItem('currentUser');
    if (!currentUser) window.location.href = 'index.html';
    var balance = parseInt(localStorage.getItem('bal_' + currentUser)) || 1000;
    var isDropping = false;
    var COLS = 7, ROWS = 9, multipliers = [0.5, 1, 2, 3, 2, 1, 0.5];
    
    async function loadAcc() { try { var snapshot = await database.ref('accounts').get(); accountsCache = snapshot.val() || {}; } catch(e) {} }
    async function saveAcc() { try { await database.ref('accounts').set(accountsCache); } catch(e) {} }
    function saveBal() { localStorage.setItem('bal_' + currentUser, balance); document.getElementById('balance-display').textContent = balance.toLocaleString() + ' РУБ'; syncNow(); }
    async function syncNow() { if (accountsCache[currentUser]) { accountsCache[currentUser].balance = balance; await saveAcc(); } }
    function addHistory(text) { var box = document.getElementById('history-box'); if(!box) return; var div = document.createElement('div'); div.textContent = text; div.style.padding = '6px 0'; div.style.borderBottom = '2px solid var(--border-dim)'; box.insertBefore(div, box.firstChild); while(box.children.length > 20) { box.removeChild(box.lastChild); } }
    document.getElementById('balance-display').textContent = balance.toLocaleString() + ' РУБ';

    var board = document.getElementById('board'), ball = document.getElementById('ball');
    var marginX = 15, marginTop = 25, boardW = board.clientWidth, boardH = 320;
    var spacingX = (boardW - marginX * 2) / (COLS - 1), spacingY = (boardH - marginTop - 50) / ROWS, ballR = 6;

    for(var r = 0; r < ROWS; r++) {
      var pegsInRow = r % 2 === 0 ? COLS : COLS + 1;
      var startX = r % 2 === 0 ? marginX : marginX - spacingX / 2;
      for(var c = 0; c < pegsInRow; c++) {
        var peg = document.createElement('div');
        peg.className = 'peg';
        peg.style.left = (startX + c * spacingX - 4) + 'px';
        peg.style.top = (marginTop + r * spacingY - 4) + 'px';
        board.appendChild(peg);
      }
    }

    var slotWidth = (boardW - marginX * 2) / COLS;
    for(var c = 0; c < COLS; c++) {
      var slot = document.createElement('div');
      slot.className = 'slot';
      slot.style.left = (marginX + c * slotWidth) + 'px';
      slot.style.width = slotWidth + 'px';
      
      if (c === 0 || c === COLS - 1) slot.style.background = 'var(--bg)';
      else if (c === 1 || c === COLS - 2) slot.style.background = 'var(--panel-light)';
      else if (c === 2 || c === COLS - 3) slot.style.background = 'var(--panel)';
      else slot.style.background = 'var(--border-dim)';
      
      slot.textContent = 'X' + multipliers[c];
      board.appendChild(slot);
    }

    function checkPegCollision(bx, by, pegX, pegY) {
      var dx = bx - (pegX + 4), dy = by - (pegY + 4);
      return Math.sqrt(dx * dx + dy * dy) < (ballR + 4);
    }

    document.getElementById('btn-drop').onclick = function() {
      if(isDropping) return;
      var bet = +document.getElementById('bet-input').value;
      if(!bet || bet <= 0 || bet > balance) { alert('НЕКОРРЕКТНАЯ СТАВКА'); return; }
      isDropping = true; document.getElementById('btn-drop').disabled = true;
      balance -= bet; saveBal();
      var posX = marginX + Math.random() * (boardW - marginX * 2) - ballR, posY = 0;
      var velX = (Math.random() - 0.5) * 1.5, velY = 0.3;
      var gravity = 0.25;
      ball.style.display = 'block';
      ball.style.left = posX + 'px';
      ball.style.top = posY + 'px';
      
      function animate() {
        if(posY > boardH - 45) {
          var landedCol = Math.min(Math.max(Math.floor((posX - marginX) / slotWidth), 0), COLS - 1);
          var mult = multipliers[landedCol], win = Math.floor(bet * mult);
          balance += win; saveBal();
          document.getElementById('status-text').textContent = 'ВЫПАЛО: X' + mult + '! ' + (win >= bet ? '+' + win + ' РУБ' : '-' + bet + ' РУБ');
          document.getElementById('status-text').style.color = win >= bet ? 'var(--text)' : 'var(--text-dim)';
          addHistory('ПЛИНКО X' + mult + ': ' + (win > 0 ? '+' + win + ' РУБ' : '-' + bet + ' РУБ'));
          setTimeout(function() { ball.style.display = 'none'; isDropping = false; document.getElementById('btn-drop').disabled = false; }, 500);
          return;
        }
        velY += gravity; posX += velX; posY += velY;
        if(posX < marginX) { posX = marginX; velX = Math.abs(velX) * 0.5; }
        if(posX > boardW - marginX - ballR * 2) { posX = boardW - marginX - ballR * 2; velX = -Math.abs(velX) * 0.5; }
        board.querySelectorAll('.peg').forEach(function(peg) {
          var pegX = parseFloat(peg.style.left), pegY = parseFloat(peg.style.top);
          if(checkPegCollision(posX + ballR, posY + ballR, pegX, pegY)) {
            var dx = (posX + ballR) - (pegX + 4), dy = (posY + ballR) - (pegY + 4);
            var dist = Math.sqrt(dx * dx + dy * dy), nx = dx / dist, ny = dy / dist;
            posX = pegX + 4 + nx * (ballR + 4) - ballR;
            posY = pegY + 4 + ny * (ballR + 4) - ballR;
            velX = (Math.random() - 0.5) * 3;
            velY = -Math.abs(velY) * (0.5 + Math.random() * 0.5);
          }
        });
        var speed = Math.sqrt(velX * velX + velY * velY);
        if(speed > 6) { velX = velX / speed * 6; velY = velY / speed * 6; }
        if(posY > boardH - 50 && Math.abs(velX) < 0.3) velX = (Math.random() - 0.5) * 2;
        ball.style.left = posX + 'px';
        ball.style.top = posY + 'px';
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    };

    (async function() { await loadAcc(); })();
  </script>
</body>
  </html>
